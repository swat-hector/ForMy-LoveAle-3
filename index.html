<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌸 Para Ale - Nuestro Jardín de Amor</title>
    <style>
        /* ===== ESTILOS COMPLETOS ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #1a0a12;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #1a0a12;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* Poemas y textos */
        .poem-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
            width: 80%;
            max-width: 600px;
        }

        .poem-text {
            font-size: 1.8rem;
            color: #fce4ec;
            text-shadow: 0 0 30px rgba(255, 105, 180, 0.5), 0 0 60px rgba(255, 20, 147, 0.3);
            opacity: 0;
            transition: opacity 1.5s ease;
            font-weight: 300;
            letter-spacing: 2px;
            line-height: 1.6;
            margin-bottom: 2rem;
            min-height: 120px;
            font-family: 'Georgia', serif;
        }

        .poem-text.show {
            opacity: 1;
        }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff6b9d, #ff1493, #ff6b9d);
            border-radius: 10px;
            transition: width 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.3);
        }

        .progress-percent {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            margin-top: 0.5rem;
            letter-spacing: 2px;
        }

        /* Botón limpiar */
        .clean-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 20;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
            pointer-events: auto;
        }

        .clean-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.2);
        }

        /* Sección mensaje final */
        .message-section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 8, 0.92);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
        }

        .message-section.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .message-content {
            max-width: 700px;
            width: 90%;
            padding: 2rem;
            text-align: center;
            animation: fadeInUp 1.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .love-message {
            font-size: 3.5rem;
            background: linear-gradient(135deg, #ff6b9d, #ff1493, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.3rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .sub-message {
            font-size: 2rem;
            color: #fce4ec;
            font-weight: 300;
            margin-bottom: 0.5rem;
        }

        .extra-message {
            font-size: 1.2rem;
            color: #e8c8d4;
            font-style: italic;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        /* Carrusel */
        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(255, 20, 147, 0.2);
            background: #1a0a12;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            touch-action: pan-y;
        }

        .carousel-slide {
            min-width: 100%;
            aspect-ratio: 4/3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #2a1420;
            padding: 20px;
            user-select: none;
        }

        .carousel-slide .placeholder-image {
            width: 100%;
            height: 80%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 5rem;
            background: linear-gradient(135deg, #2a1420, #1a0a12);
            border-radius: 12px;
            border: 2px solid rgba(255, 20, 147, 0.2);
        }

        .carousel-slide .placeholder-image span {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 10px;
        }

        .image-caption {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-top: 10px;
            font-style: italic;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .carousel-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.3);
        }

        .carousel-btn.prev { left: 12px; }
        .carousel-btn.next { right: 12px; }

        .dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 1.5rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            cursor: pointer;
            transition: all 0.4s ease;
            padding: 0;
            pointer-events: auto;
        }

        .dot:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .dot.active {
            background: #ff1493;
            transform: scale(1.4);
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.4);
        }

        .carousel-hint {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
            margin-top: 1rem;
        }

        /* Corazones flotantes */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            font-size: 1.5rem;
            animation: floatHeart linear forwards;
            opacity: 0.4;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% {
                transform: translateY(-10vh) rotate(720deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .love-message { font-size: 2.2rem; }
            .sub-message { font-size: 1.3rem; }
            .extra-message { font-size: 1rem; }
            .poem-text { font-size: 1.2rem; }
            .carousel-btn { width: 36px; height: 36px; font-size: 1.3rem; }
            .clean-btn { padding: 8px 16px; font-size: 0.8rem; bottom: 20px; right: 20px; }
            .carousel-slide .placeholder-image { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <!-- Contenedor del canvas -->
    <div class="container">
        <canvas id="canvas"></canvas>
        
        <!-- Textos que aparecen durante el dibujo -->
        <div id="poemContainer" class="poem-container">
            <p id="poemText" class="poem-text"></p>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <div class="progress-percent" id="progressPercent">0%</div>
        </div>

        <!-- Botón de limpiar -->
        <div class="clean-btn" id="cleanBtn">✨ Volver a empezar</div>
    </div>

    <!-- Sección del mensaje final y carrusel -->
    <div id="messageSection" class="message-section">
        <div class="message-content">
            <h1 class="love-message">🌹 Te amo Ale 🌹</h1>
            <h2 class="sub-message">Gracias por estos 6 Meses a tu lado</h2>
            <p class="extra-message">"Cada día contigo es un poema que el corazón escribe"</p>
            
            <div class="carousel-container">
                <button class="carousel-btn prev" id="prevBtn">‹</button>
                <div class="carousel-track" id="carouselTrack">
                    <!-- Las imágenes se generarán con JavaScript -->
                </div>
                <button class="carousel-btn next" id="nextBtn">›</button>
            </div>
            <div class="dots" id="dotsContainer"></div>
            
            <div class="carousel-hint">🖱️ Desliza o usa los botones para ver más recuerdos</div>
            
            <div class="floating-hearts" id="floatingHearts"></div>
        </div>
    </div>

    <script>
        // ============================
        // 1. CONFIGURACIÓN DE THREE.JS
        // ============================
        let scene, camera, renderer, material, mesh;
        let progress = 0;
        let isComplete = false;
        let poemIndex = 0;
        let startTime = Date.now();
        let animationId = null;

        // Poemas y textos románticos
        const poems = [
            { text: '🌷 "En el jardín de mi corazón, tú eres la flor más hermosa"', delay: 2 },
            { text: '🌸 "Cada latido es un poema que escribo pensando en ti"', delay: 4 },
            { text: '🌺 "Tu amor es la luz que ilumina mis días más oscuros"', delay: 6 },
            { text: '🌹 "Eres el sueño del que nunca quiero despertar"', delay: 8 },
            { text: '💖 "Contigo, cada momento es una obra de arte"', delay: 10 },
            { text: '✨ "Tu sonrisa es el sol que hace florecer mi alma"', delay: 12 },
            { text: '💝 "6 meses de magia, infinitos más por descubrir"', delay: 14 }
        ];

        // Imágenes para el carrusel (emojis y colores)
        const carouselImages = [
            { emoji: '🌅', color: '#ff6b6b', caption: '✨ Nuestro primer atardecer' },
            { emoji: '💖', color: '#ff1493', caption: '💖 Tu sonrisa ilumina mis días' },
            { emoji: '🌸', color: '#ff6b9d', caption: '🌸 Momentos que atesoro' },
            { emoji: '🌺', color: '#ff4757', caption: '🌺 Eres mi razón para sonreír' },
            { emoji: '💝', color: '#ff6348', caption: '💝 Por siempre tú y yo' }
        ];

        // ============================
        // 2. INICIALIZAR THREE.JS
        // ============================
        function init() {
            const canvas = document.getElementById('canvas');
            const width = window.innerWidth;
            const height = window.innerHeight;

            scene = new THREE.Scene();

            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 10);
            camera.position.z = 1;

            renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: true,
                alpha: true
            });
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Fragment Shader (definido inline)
            const fragmentShader = `
                #define PI 3.14159265359

                uniform float u_ratio;
                uniform vec2 u_cursor;
                uniform float u_stop_time;
                uniform float u_clean;
                uniform vec2 u_stop_randomizer;
                uniform float u_progress;

                varying vec2 vUv;

                // 2D noise
                vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }
                
                float snoise(vec2 v) {
                    const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
                    vec2 i = floor(v + dot(v, C.yy));
                    vec2 x0 = v - i + dot(i, C.xx);
                    vec2 i1;
                    i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                    vec4 x12 = x0.xyxy + C.xxzz;
                    x12.xy -= i1;
                    i = mod289(i);
                    vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
                    vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
                    m = m*m;
                    m = m*m;
                    vec3 x = 2.0 * fract(p * C.www) - 1.0;
                    vec3 h = abs(x) - 0.5;
                    vec3 ox = floor(x + 0.5);
                    vec3 a0 = x - ox;
                    m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
                    vec3 g;
                    g.x = a0.x * x0.x + h.x * x0.y;
                    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                    return 130.0 * dot(m, g);
                }

                // Función para crear un lirio
                float get_lily_shape(vec2 p, float petal_count, float angle, float outline) {
                    float a = atan(p.y, p.x);
                    float r = length(p);
                    
                    float ca = cos(angle);
                    float sa = sin(angle);
                    vec2 rotated_p = vec2(p.x * ca - p.y * sa, p.x * sa + p.y * ca);
                    a = atan(rotated_p.y, rotated_p.x);
                    
                    float petal_shape = abs(cos(a * petal_count * 0.5));
                    float petal_radius = 0.5 + 0.5 * petal_shape;
                    
                    float curve = 0.3 * sin(a * 3.0 + 1.2) + 0.1 * sin(a * 5.0 + 2.0);
                    float r_petal = r / (petal_radius + curve * 0.2);
                    
                    float edge = 1.0 - smoothstep(0.7, 1.3, r_petal);
                    
                    float vein = 0.0;
                    if (r_petal < 1.0 && r_petal > 0.1) {
                        float vein_pattern = sin(a * petal_count * 2.0 + r * 12.0) * 0.5 + 0.5;
                        vein = vein_pattern * (1.0 - r_petal) * 0.4;
                        float main_vein = 1.0 - smoothstep(0.0, 0.3, abs(sin(a * petal_count * 0.5) * r * 2.0));
                        vein += main_vein * 0.2 * (1.0 - r_petal);
                    }
                    
                    float center_glow = exp(-r * 12.0) * 0.3;
                    
                    return max(0.0, edge + vein + center_glow);
                }

                // Función para hojas
                float get_leaf(vec2 p, float angle, float size) {
                    float ca = cos(angle);
                    float sa = sin(angle);
                    vec2 rp = vec2(p.x * ca - p.y * sa, p.x * sa + p.y * ca);
                    
                    float leaf_shape = 1.0 - smoothstep(0.0, size, abs(rp.x));
                    leaf_shape *= 1.0 - smoothstep(0.0, size * 0.5, abs(rp.y));
                    leaf_shape *= 1.0 - smoothstep(0.0, size * 0.3, abs(rp.x * 0.5 + rp.y));
                    
                    return max(0.0, leaf_shape);
                }

                void main() {
                    vec2 uv = vUv;
                    float aspect = u_ratio;
                    vec2 center = vec2(0.5, 0.5);
                    
                    vec2 p = uv - center;
                    p.x *= aspect;
                    
                    float progress = u_progress;
                    float time = u_stop_time;
                    
                    vec3 color = vec3(0.0);
                    vec3 bg_color = vec3(0.98, 0.92, 0.94);
                    
                    vec2 bg_p = uv;
                    vec3 bg_grad = mix(
                        vec3(0.98, 0.93, 0.95),
                        vec3(0.95, 0.88, 0.92),
                        length(uv - 0.5) * 0.8
                    );
                    color = bg_grad;
                    
                    float num_lilies = floor(progress * 8.0) + 1.0;
                    
                    for (float i = 0.0; i < 9.0; i += 1.0) {
                        if (i >= num_lilies) break;
                        
                        vec2 pos;
                        float size_offset = 0.0;
                        
                        if (i == 0.0) { pos = vec2(0.0, 0.0); size_offset = 0.0; }
                        else if (i == 1.0) { pos = vec2(-0.25, 0.2); size_offset = 0.02; }
                        else if (i == 2.0) { pos = vec2(0.25, -0.15); size_offset = -0.02; }
                        else if (i == 3.0) { pos = vec2(-0.35, -0.2); size_offset = 0.04; }
                        else if (i == 4.0) { pos = vec2(0.35, 0.25); size_offset = -0.01; }
                        else if (i == 5.0) { pos = vec2(-0.15, -0.35); size_offset = 0.03; }
                        else if (i == 6.0) { pos = vec2(0.15, 0.35); size_offset = 0.0; }
                        else if (i == 7.0) { pos = vec2(-0.45, 0.1); size_offset = 0.05; }
                        else if (i == 8.0) { pos = vec2(0.45, -0.1); size_offset = -0.03; }
                        
                        vec2 delta = p - pos;
                        
                        float size = 0.09 + 0.03 * sin(i * 1.3 + 2.0) + size_offset;
                        
                        vec3 color1, color2, color3;
                        float petal_count = 6.0 + sin(i * 2.0 + 1.0) * 1.0;
                        
                        if (mod(i, 3.0) < 1.0) {
                            color1 = vec3(0.99, 0.75, 0.85);
                            color2 = vec3(0.95, 0.55, 0.70);
                            color3 = vec3(1.0, 0.88, 0.92);
                        } else if (mod(i, 3.0) < 2.0) {
                            color1 = vec3(0.98, 0.80, 0.88);
                            color2 = vec3(0.92, 0.60, 0.75);
                            color3 = vec3(1.0, 0.90, 0.94);
                        } else {
                            color1 = vec3(0.96, 0.70, 0.80);
                            color2 = vec3(0.90, 0.45, 0.60);
                            color3 = vec3(0.98, 0.85, 0.90);
                        }
                        
                        float lily_shape = get_lily_shape(
                            delta / size,
                            petal_count,
                            i * 0.8 + time * 0.05,
                            0.3
                        );
                        
                        float bloom = 1.0 - smoothstep(0.0, 0.4, i / num_lilies);
                        float lily_intensity = lily_shape * bloom * 0.9;
                        
                        vec3 lily_color = mix(color1, color2, lily_shape);
                        lily_color = mix(lily_color, color3, 0.3 * (1.0 - lily_shape));
                        
                        color = mix(color, lily_color, lily_intensity);
                        
                        if (lily_shape > 0.05) {
                            float shadow = 0.08 * (1.0 - lily_shape) * bloom;
                            color -= shadow * 0.3;
                        }
                        
                        if (length(delta / size) < 0.12 && lily_shape > 0.3) {
                            vec3 center_color = vec3(1.0, 0.85, 0.2);
                            float center_intensity = 1.0 - smoothstep(0.0, 0.12, length(delta / size));
                            center_intensity *= 0.6 * bloom;
                            color = mix(color, center_color, center_intensity);
                            
                            float pollen = sin(length(delta / size) * 50.0 + time) * 0.5 + 0.5;
                            pollen *= (1.0 - length(delta / size) * 8.0);
                            pollen = max(0.0, pollen) * 0.3 * bloom;
                            color += vec3(1.0, 0.9, 0.4) * pollen;
                        }
                    }
                    
                    if (progress > 0.15) {
                        float leaf_progress = (progress - 0.15) / 0.3;
                        for (float i = 0.0; i < 6.0; i += 1.0) {
                            float leaf_pos = i / 6.0;
                            float leaf_angle = leaf_pos * 6.28 + 0.5;
                            vec2 leaf_pos = vec2(
                                0.08 * cos(leaf_angle + 0.3),
                                0.08 * sin(leaf_angle * 1.2 + 0.5)
                            );
                            
                            vec2 delta_leaf = p - leaf_pos;
                            float leaf_size = 0.03 + 0.02 * sin(i * 1.7);
                            
                            float leaf = get_leaf(delta_leaf, leaf_angle + 0.5, leaf_size);
                            leaf *= leaf_progress;
                            
                            vec3 leaf_color = mix(
                                vec3(0.2, 0.6, 0.2),
                                vec3(0.3, 0.7, 0.3),
                                sin(i * 1.3) * 0.5 + 0.5
                            );
                            
                            color = mix(color, leaf_color, leaf * 0.4);
                        }
                    }
                    
                    if (progress > 0.2) {
                        float particle_intensity = min(1.0, (progress - 0.2) * 2.0);
                        for (float i = 0.0; i < 40.0; i += 1.0) {
                            float px = fract(sin(i * 127.1 + 311.7 + time * 0.1) * 43758.5453);
                            float py = fract(sin(i * 269.5 + 183.3 + time * 0.07) * 43758.5453);
                            float ps = 0.0015 + 0.003 * sin(i * 3.7 + time * 0.5);
                            float float_offset = sin(i * 2.3 + time * 0.3) * 0.03;
                            
                            vec2 pp = vec2(px + float_offset * 0.5, py + float_offset * 0.3);
                            float dist = length(uv - pp);
                            
                            if (dist < ps && progress > 0.2 + i * 0.015) {
                                float brightness = 0.4 * (1.0 - dist / ps) * particle_intensity;
                                float twinkle = sin(time * 2.0 + i * 5.0) * 0.5 + 0.5;
                                brightness *= (0.5 + 0.5 * twinkle);
                                color += vec3(1.0, 0.92, 0.85) * brightness * 0.6;
                            }
                        }
                    }
                    
                    float warm_glow = 0.05 * sin(time * 0.3 + 1.0) + 0.05;
                    color += vec3(warm_glow * 0.3, warm_glow * 0.2, warm_glow * 0.1);
                    
                    float vignette = 1.0 - length((uv - 0.5) * 1.3);
                    vignette = smoothstep(0.0, 0.7, vignette);
                    color *= (0.75 + 0.25 * vignette);
                    
                    vec2 cursor_pos = u_cursor;
                    float cursor_dist = length(uv - cursor_pos);
                    float cursor_light = exp(-cursor_dist * 6.0) * 0.15;
                    color += vec3(1.0, 0.9, 0.85) * cursor_light;
                    
                    gl_FragColor = vec4(color, 1.0);
                }
            `;

            // Uniformes
            const uniforms = {
                u_ratio: { value: width / height },
                u_cursor: { value: new THREE.Vector2(0.5, 0.5) },
                u_stop_time: { value: 0.0 },
                u_clean: { value: 0.0 },
                u_stop_randomizer: { value: new THREE.Vector2(0.0, 0.0) },
                u_progress: { value: 0.0 }
            };

            material = new THREE.ShaderMaterial({
                uniforms: uniforms,
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: fragmentShader
            });

            const geometry = new THREE.PlaneGeometry(2, 2);
            mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            // Event listeners
            window.addEventListener('resize', onResize);
            canvas.addEventListener('mousemove', onMouseMove);
            document.getElementById('cleanBtn').addEventListener('click', cleanScreen);

            // Iniciar
            animate();
            setTimeout(showNextPoem, 1000);
        }

        // ============================
        // 3. ANIMACIÓN PRINCIPAL
        // ============================
        let lastTime = 0;

        function animate(time = 0) {
            animationId = requestAnimationFrame(animate);
            
            const delta = lastTime ? (time - lastTime) / 1000 : 0.016;
            lastTime = time;

            const elapsed = (Date.now() - startTime) / 1000;
            material.uniforms.u_stop_time.value = elapsed * 0.3;

            if (!isComplete && progress < 1) {
                progress += delta * 0.035;
                if (progress > 1) {
                    progress = 1;
                    isComplete = true;
                    setTimeout(showFinalMessage, 1500);
                }
                material.uniforms.u_progress.value = progress;
                document.getElementById('progressFill').style.width = (progress * 100) + '%';
                document.getElementById('progressPercent').textContent = Math.round(progress * 100) + '%';
            }

            material.uniforms.u_stop_randomizer.value = new THREE.Vector2(
                Math.sin(elapsed * 0.7) * 0.5 + 0.5,
                Math.cos(elapsed * 0.5) * 0.5 + 0.5
            );

            renderer.render(scene, camera);
        }

        // ============================
        // 4. SISTEMA DE POEMAS
        // ============================
        let currentPoemTimeout = null;

        function showNextPoem() {
            if (poemIndex >= poems.length || isComplete) return;

            const poem = poems[poemIndex];
            const poemText = document.getElementById('poemText');
            
            poemText.textContent = poem.text;
            poemText.classList.add('show');
            
            const nextDelay = poem.delay * 1000 + 2000;
            currentPoemTimeout = setTimeout(() => {
                poemText.classList.remove('show');
                poemIndex++;
                setTimeout(showNextPoem, 1000);
            }, nextDelay);
        }

        // ============================
        // 5. MENSAJE FINAL Y CARRUSEL
        // ============================
        let carouselInitialized = false;

        function showFinalMessage() {
            const section = document.getElementById('messageSection');
            section.classList.add('visible');
            
            if (!carouselInitialized) {
                setTimeout(() => {
                    initCarousel();
                    carouselInitialized = true;
                }, 500);
            }
            
            createFloatingHearts();
        }

        // ============================
        // 6. CARRUSEL (VERSIÓN CORREGIDA)
        // ============================
        let currentSlide = 0;
        let totalSlides = 0;
        let carouselInterval = null;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        function initCarousel() {
            const track = document.getElementById('carouselTrack');
            const dotsContainer = document.getElementById('dotsContainer');
            
            // Limpiar y generar slides
            track.innerHTML = '';
            carouselImages.forEach((img, index) => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide';
                slide.innerHTML = `
                    <div class="placeholder-image" style="background: linear-gradient(135deg, ${img.color}33, ${img.color}11); border-color: ${img.color}44;">
                        <div style="font-size: 4rem;">${img.emoji}</div>
                        <span style="color: ${img.color}; font-size: 0.8rem;">❤️ Recuerdo especial</span>
                    </div>
                    <div class="image-caption" style="color: ${img.color};">${img.caption}</div>
                `;
                track.appendChild(slide);
            });

            totalSlides = carouselImages.length;

            // Crear dots
            dotsContainer.innerHTML = '';
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('button');
                dot.className = 'dot' + (i === 0 ? ' active' : '');
                dot.dataset.index = i;
                dot.addEventListener('click', function(e) {
                    e.stopPropagation();
                    goToSlide(parseInt(this.dataset.index));
                });
                dotsContainer.appendChild(dot);
            }

            // Botones - Usar event listeners directos
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            // Remover listeners antiguos clonando
            const newPrev = prevBtn.cloneNode(true);
            const newNext = nextBtn.cloneNode(true);
            prevBtn.parentNode.replaceChild(newPrev, prevBtn);
            nextBtn.parentNode.replaceChild(newNext, nextBtn);
            
            newPrev.addEventListener('click', function(e) {
                e.stopPropagation();
                goToSlide(currentSlide - 1);
            });
            
            newNext.addEventListener('click', function(e) {
                e.stopPropagation();
                goToSlide(currentSlide + 1);
            });

            // Touch / drag
            track.addEventListener('mousedown', startDrag);
            track.addEventListener('touchstart', startDragTouch, { passive: true });
            
            // Movimiento en el documento para mejor detección
            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', dragTouch, { passive: true });
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);

            // Auto-play
            startAutoPlay();

            updateCarousel();
        }

        function goToSlide(index) {
            if (totalSlides === 0) return;
            if (index < 0) index = totalSlides - 1;
            if (index >= totalSlides) index = 0;
            currentSlide = index;
            updateCarousel();
            resetAutoPlay();
        }

        function updateCarousel() {
            const track = document.getElementById('carouselTrack');
            if (!track) return;
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
            track.style.transition = 'transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94)';

            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === currentSlide);
            });
        }

        function startAutoPlay() {
            if (carouselInterval) clearInterval(carouselInterval);
            carouselInterval = setInterval(() => {
                goToSlide(currentSlide + 1);
            }, 3500);
        }

        function resetAutoPlay() {
            if (carouselInterval) {
                clearInterval(carouselInterval);
                carouselInterval = setInterval(() => {
                    goToSlide(currentSlide + 1);
                }, 3500);
            }
        }

        function stopAutoPlay() {
            if (carouselInterval) {
                clearInterval(carouselInterval);
                carouselInterval = null;
            }
        }

        // Drag con mouse
        function startDrag(e) {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            stopAutoPlay();
        }

        function drag(e) {
            if (!isDragging) return;
            const diffX = e.clientX - startX;
            const diffY = e.clientY - startY;
            
            // Solo si el movimiento es más horizontal que vertical
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 30) {
                if (diffX > 0) {
                    goToSlide(currentSlide - 1);
                } else {
                    goToSlide(currentSlide + 1);
                }
                isDragging = false;
            }
        }

        function endDrag() {
            isDragging = false;
            if (!carouselInterval) {
                startAutoPlay();
            }
        }

        // Drag táctil
        function startDragTouch(e) {
            isDragging = true;
            const touch = e.touches[0];
            startX = touch.clientX;
            startY = touch.clientY;
            stopAutoPlay();
        }

        function dragTouch(e) {
            if (!isDragging) return;
            const touch = e.touches[0];
            const diffX = touch.clientX - startX;
            const diffY = touch.clientY - startY;
            
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 30) {
                if (diffX > 0) {
                    goToSlide(currentSlide - 1);
                } else {
                    goToSlide(currentSlide + 1);
                }
                isDragging = false;
            }
        }

        // ============================
        // 7. CORAZONES FLOTANTES
        // ============================
        let heartsInterval = null;

        function createFloatingHearts() {
            const container = document.getElementById('floatingHearts');
            const emojis = ['❤️', '💕', '💗', '💖', '💝', '💘'];
            
            if (heartsInterval) clearInterval(heartsInterval);
            
            heartsInterval = setInterval(() => {
                if (!document.getElementById('messageSection').classList.contains('visible')) return;
                
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
                heart.style.animationDuration = (8 + Math.random() * 12) + 's';
                heart.style.animationDelay = (Math.random() * 3) + 's';
                
                container.appendChild(heart);
                
                setTimeout(() => heart.remove(), 15000);
            }, 1000);
        }

        // ============================
        // 8. EVENTOS
        // ============================
        function onMouseMove(event) {
            const rect = event.target.getBoundingClientRect();
            const x = (event.clientX - rect.left) / rect.width;
            const y = 1 - (event.clientY - rect.top) / rect.height;
            material.uniforms.u_cursor.value.set(x, y);
        }

        function cleanScreen() {
            if (isComplete) {
                progress = 0;
                isComplete = false;
                startTime = Date.now();
                poemIndex = 0;
                carouselInitialized = false;
                currentSlide = 0;
                
                document.getElementById('messageSection').classList.remove('visible');
                document.getElementById('poemText').classList.remove('show');
                
                if (currentPoemTimeout) {
                    clearTimeout(currentPoemTimeout);
                    currentPoemTimeout = null;
                }
                
                if (carouselInterval) {
                    clearInterval(carouselInterval);
                    carouselInterval = null;
                }
                
                if (heartsInterval) {
                    clearInterval(heartsInterval);
                    heartsInterval = null;
                }
                
                // Limpiar corazones flotantes
                document.getElementById('floatingHearts').innerHTML = '';
                
                setTimeout(showNextPoem, 1000);
            }
        }

        function onResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            material.uniforms.u_ratio.value = width / height;
        }

        // ============================
        // 9. INICIAR
        // ============================
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
