<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌸 Para Ale</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- Fondo de pétalos flotantes -->
    <div id="petals-container"></div>

    <!-- Sección 1: Dibujo de lirios -->
    <section id="lilies-section" class="section">
        <div class="content">
            <h1 class="title">🌸</h1>
            <canvas id="lilyCanvas" width="600" height="500"></canvas>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <p class="hint">Observa cómo florecen los lirios...</p>
        </div>
    </section>

    <!-- Sección 2: Mensaje y carrusel -->
    <section id="message-section" class="section hidden">
        <div class="content">
            <h1 class="love-message">Te amo Ale ❤️</h1>
            <h2 class="sub-message">Gracias por estos 6 Meses a tu lado</h2>
            <p class="extra-message">Cada día a tu lado es un nuevo amanecer lleno de colores ✨</p>

            <div class="carousel-container">
                <button class="carousel-btn prev" id="prevBtn">‹</button>
                <div class="carousel-track" id="carouselTrack">
                    <div class="carousel-slide">
                        <img src="images/262e46c9-8d04-472c-96be-9b967b57a7f2.jpeg" alt="Foto 1" />
                    </div>
                    <div class="carousel-slide">
                        <img src="images/foto2.jpg" alt="Foto 2" />
                    </div>
                    <div class="carousel-slide">
                        <img src="images/foto3.jpg" alt="Foto 3" />
                    </div>
                    <div class="carousel-slide">
                        <img src="images/foto4.jpg" alt="Foto 4" />
                    </div>
                    <div class="carousel-slide">
                        <img src="images/foto5.jpg" alt="Foto 5" />
                    </div>
                </div>
                <button class="carousel-btn next" id="nextBtn">›</button>
            </div>
            <div class="dots" id="dotsContainer"></div>
            <p class="carousel-hint">🖱️ Desliza o usa los botones</p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
