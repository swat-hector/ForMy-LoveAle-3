<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌸 Para Ale - Nuestro Jardín de Amor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #1a0a12;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #1a0a12;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Poemas y textos */
        .poem-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
            width: 80%;
            max-width: 600px;
        }

        .poem-text {
            font-size: 1.8rem;
            color: #fce4ec;
            text-shadow: 0 0 30px rgba(255, 105, 180, 0.5), 0 0 60px rgba(255, 20, 147, 0.3);
            opacity: 0;
            transition: opacity 1.5s ease;
            font-weight: 300;
            letter-spacing: 2px;
            line-height: 1.6;
            margin-bottom: 2rem;
            min-height: 120px;
            font-family: 'Georgia', serif;
        }

        .poem-text.show {
            opacity: 1;
        }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff6b9d, #ff1493, #ff6b9d);
            border-radius: 10px;
            transition: width 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.3);
        }

        .progress-percent {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            margin-top: 0.5rem;
            letter-spacing: 2px;
        }

        /* Botón limpiar */
        .clean-btn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 20;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
            pointer-events: auto;
        }

        .clean-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.2);
        }

        /* Sección mensaje final */
        .message-section {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 8, 0.92);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.5s ease;
        }

        .message-section.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .message-content {
            max-width: 700px;
            width: 90%;
            padding: 2rem;
            text-align: center;
            animation: fadeInUp 1.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .love-message {
            font-size: 3.5rem;
            background: linear-gradient(135deg, #ff6b9d, #ff1493, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.3rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .sub-message {
            font-size: 2rem;
            color: #fce4ec;
            font-weight: 300;
            margin-bottom: 0.5rem;
        }

        .extra-message {
            font-size: 1.2rem;
            color: #e8c8d4;
            font-style: italic;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        /* Carrusel */
        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(255, 20, 147, 0.2);
            background: #1a0a12;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            touch-action: pan-y;
        }

        .carousel-slide {
            min-width: 100%;
            aspect-ratio: 4/3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #2a1420;
            padding: 20px;
            user-select: none;
        }

        .carousel-slide .placeholder-image {
            width: 100%;
            height: 80%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 5rem;
            background: linear-gradient(135deg, #2a1420, #1a0a12);
            border-radius: 12px;
            border: 2px solid rgba(255, 20, 147, 0.2);
        }

        .carousel-slide .placeholder-image span {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 10px;
        }

        .image-caption {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-top: 10px;
            font-style: italic;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .carousel-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.3);
        }

        .carousel-btn.prev { left: 12px; }
        .carousel-btn.next { right: 12px; }

        .dots {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 1.5rem;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            cursor: pointer;
            transition: all 0.4s ease;
            padding: 0;
            pointer-events: auto;
        }

        .dot:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .dot.active {
            background: #ff1493;
            transform: scale(1.4);
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.4);
        }

        .carousel-hint {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.8rem;
            margin-top: 1rem;
        }

        /* Corazones flotantes */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            font-size: 1.5rem;
            animation: floatHeart linear forwards;
            opacity: 0.4;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% {
                transform: translateY(-10vh) rotate(720deg) scale(1.2);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .love-message { font-size: 2.2rem; }
            .sub-message { font-size: 1.3rem; }
            .extra-message { font-size: 1rem; }
            .poem-text { font-size: 1.2rem; }
            .carousel-btn { width: 36px; height: 36px; font-size: 1.3rem; }
            .clean-btn { padding: 8px 16px; font-size: 0.8rem; bottom: 20px; right: 20px; }
            .carousel-slide .placeholder-image { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="canvas"></canvas>
        
        <div id="poemContainer" class="poem-container">
            <p id="poemText" class="poem-text"></p>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <div class="progress-percent" id="progressPercent">0%</div>
        </div>

        <div class="clean-btn" id="cleanBtn">✨ Volver a empezar</div>
    </div>

    <div id="messageSection" class="message-section">
        <div class="message-content">
            <h1 class="love-message">🌹 Te amo Ale 🌹</h1>
            <h2 class="sub-message">Gracias por estos 6 Meses a tu lado</h2>
            <p class="extra-message">"Cada día contigo es un poema que el corazón escribe"</p>
            
            <div class="carousel-container">
                <button class="carousel-btn prev" id="prevBtn">‹</button>
                <div class="carousel-track" id="carouselTrack"></div>
                <button class="carousel-btn next" id="nextBtn">›</button>
            </div>
            <div class="dots" id="dotsContainer"></div>
            <div class="carousel-hint">🖱️ Desliza o usa los botones</div>
            <div class="floating-hearts" id="floatingHearts"></div>
        </div>
    </div>

    <script>
        // ============================================
        // 1. DIBUJO DE LIRIOS CON CANVAS 2D
        // ============================================
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let progress = 0;
        let isComplete = false;
        let poemIndex = 0;
        let animationFrame = null;
        let startTime = Date.now();

        // Poemas
        const poems = [
            { text: '🌷 "En el jardín de mi corazón, tú eres la flor más hermosa"', delay: 2 },
            { text: '🌸 "Cada latido es un poema que escribo pensando en ti"', delay: 4 },
            { text: '🌺 "Tu amor es la luz que ilumina mis días más oscuros"', delay: 6 },
            { text: '🌹 "Eres el sueño del que nunca quiero despertar"', delay: 8 },
            { text: '💖 "Contigo, cada momento es una obra de arte"', delay: 10 },
            { text: '✨ "Tu sonrisa es el sol que hace florecer mi alma"', delay: 12 },
            { text: '💝 "6 meses de magia, infinitos más por descubrir"', delay: 14 }
        ];

        // Imágenes del carrusel
        const carouselImages = [
            { emoji: '🌅', color: '#ff6b6b', caption: '✨ Nuestro primer atardecer' },
            { emoji: '💖', color: '#ff1493', caption: '💖 Tu sonrisa ilumina mis días' },
            { emoji: '🌸', color: '#ff6b9d', caption: '🌸 Momentos que atesoro' },
            { emoji: '🌺', color: '#ff4757', caption: '🌺 Eres mi razón para sonreír' },
            { emoji: '💝', color: '#ff6348', caption: '💝 Por siempre tú y yo' }
        ];

        // ============================================
        // 2. FUNCIONES DE DIBUJO
        // ============================================
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        function drawLily(ctx, x, y, size, color1, color2, rotation, alpha) {
            ctx.save();
            ctx.globalAlpha = alpha || 1;
            ctx.translate(x, y);
            ctx.rotate(rotation || 0);

            const petals = 6;
            const petalLength = size * 0.9;
            const petalWidth = size * 0.35;

            for (let i = 0; i < petals; i++) {
                const angle = (i / petals) * Math.PI * 2 - Math.PI / 2;
                const px = Math.cos(angle) * petalLength * 0.6;
                const py = Math.sin(angle) * petalLength * 0.6;

                ctx.save();
                ctx.translate(px, py);
                ctx.rotate(angle);

                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, petalWidth);
                grad.addColorStop(0, color1);
                grad.addColorStop(0.7, color2);
                grad.addColorStop(1, 'rgba(200,100,120,0.1)');

                ctx.beginPath();
                ctx.ellipse(0, 0, petalWidth, petalLength * 0.5, 0, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                // Nervadura
                ctx.strokeStyle = 'rgba(180,80,100,0.15)';
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.moveTo(0, -petalLength * 0.3);
                ctx.quadraticCurveTo(petalWidth * 0.3, 0, 0, petalLength * 0.3);
                ctx.stroke();

                ctx.restore();
            }

            // Centro
            const centerGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 0.15);
            centerGrad.addColorStop(0, '#ffeb3b');
            centerGrad.addColorStop(0.5, '#f9a825');
            centerGrad.addColorStop(1, '#e65100');
            ctx.beginPath();
            ctx.arc(0, 0, size * 0.12, 0, Math.PI * 2);
            ctx.fillStyle = centerGrad;
            ctx.fill();

            // Estambres
            for (let i = 0; i < 8; i++) {
                const a = (i / 8) * Math.PI * 2;
                const r = size * 0.2;
                const sx = Math.cos(a) * r;
                const sy = Math.sin(a) * r;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(sx, sy);
                ctx.strokeStyle = '#bf8f3a';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(sx, sy, 2, 0, Math.PI * 2);
                ctx.fillStyle = '#e6a53a';
                ctx.fill();
            }

            ctx.restore();
        }

        function drawScene(progress) {
            const w = canvas.width;
            const h = canvas.height;

            // Fondo
            const grad = ctx.createRadialGradient(w * 0.5, h * 0.5, 0, w * 0.5, h * 0.5, w * 0.7);
            grad.addColorStop(0, '#fce8e6');
            grad.addColorStop(0.5, '#f5d6d0');
            grad.addColorStop(1, '#e8c4c0');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, h);

            // Calcular número de lirios
            const numLilies = Math.min(8, Math.floor(progress * 8) + 1);

            // Posiciones de los lirios
            const positions = [
                { x: 0.5, y: 0.5, size: 0.12, rot: 0 },
                { x: 0.3, y: 0.55, size: 0.09, rot: 0.3 },
                { x: 0.7, y: 0.4, size: 0.08, rot: -0.2 },
                { x: 0.25, y: 0.35, size: 0.07, rot: 0.5 },
                { x: 0.75, y: 0.6, size: 0.07, rot: -0.4 },
                { x: 0.4, y: 0.75, size: 0.06, rot: 0.8 },
                { x: 0.6, y: 0.25, size: 0.06, rot: -0.6 },
                { x: 0.15, y: 0.7, size: 0.05, rot: 1.2 }
            ];

            // Colores de lirios
            const colors = [
                ['#f8bbd0', '#f06292'],
                ['#f48fb1', '#ec407a'],
                ['#fce4ec', '#e91e63'],
                ['#f8bbd0', '#d81b60'],
                ['#fce4ec', '#f06292'],
                ['#f48fb1', '#ec407a'],
                ['#f8bbd0', '#d81b60'],
                ['#fce4ec', '#e91e63']
            ];

            // Dibujar hojas (base verde)
            if (progress > 0.1) {
                ctx.save();
                ctx.globalAlpha = Math.min(1, (progress - 0.1) * 2);
                for (let i = 0; i < 8; i++) {
                    const lx = w * (0.1 + i * 0.1);
                    const ly = h * (0.7 + Math.sin(i * 1.2) * 0.05);
                    ctx.beginPath();
                    ctx.ellipse(lx, ly, 20, 8, i * 0.4, 0, Math.PI * 2);
                    ctx.fillStyle = i % 2 === 0 ? '#66bb6a' : '#81c784';
                    ctx.fill();
                }
                ctx.restore();
            }

            // Dibujar lirios
            for (let i = 0; i < numLilies && i < positions.length; i++) {
                const pos = positions[i];
                const color = colors[i % colors.length];
                const alpha = Math.min(1, (progress - i / 8) * 3);
                
                drawLily(
                    ctx,
                    w * pos.x,
                    h * pos.y,
                    Math.min(w, h) * pos.size,
                    color[0],
                    color[1],
                    pos.rot + Date.now() * 0.0001,
                    alpha
                );
            }

            // Partículas (polen)
            if (progress > 0.2) {
                const time = Date.now() / 1000;
                for (let i = 0; i < 30; i++) {
                    const px = (Math.sin(i * 127.1 + time * 0.5) * 0.5 + 0.5) * w;
                    const py = (Math.cos(i * 269.5 + time * 0.3) * 0.5 + 0.5) * h;
                    const size = 1 + Math.sin(i * 3.7 + time) * 1;
                    const brightness = 0.3 + 0.3 * Math.sin(time + i);
                    
                    ctx.beginPath();
                    ctx.arc(px, py, size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 220, 200, ${brightness * 0.3})`;
                    ctx.fill();
                }
            }

            // Brillo final
            if (progress > 0.9) {
                ctx.save();
                ctx.globalAlpha = (progress - 0.9) * 5;
                const glow = ctx.createRadialGradient(w * 0.5, h * 0.4, 0, w * 0.5, h * 0.4, w * 0.5);
                glow.addColorStop(0, 'rgba(255,200,210,0.15)');
                glow.addColorStop(1, 'rgba(255,200,210,0)');
                ctx.fillStyle = glow;
                ctx.fillRect(0, 0, w, h);
                ctx.restore();
            }
        }

        // ============================================
        // 3. ANIMACIÓN
        // ============================================
        let lastFrameTime = 0;

        function animate(time) {
            const delta = lastFrameTime ? (time - lastFrameTime) / 1000 : 0.016;
            lastFrameTime = time;

            if (!isComplete && progress < 1) {
                progress += delta * 0.035;
                if (progress > 1) {
                    progress = 1;
                    isComplete = true;
                    setTimeout(showFinalMessage, 1500);
                }
                document.getElementById('progressFill').style.width = (progress * 100) + '%';
                document.getElementById('progressPercent').textContent = Math.round(progress * 100) + '%';
            }

            drawScene(progress);
            animationFrame = requestAnimationFrame(animate);
        }

        // ============================================
        // 4. SISTEMA DE POEMAS
        // ============================================
        let currentPoemTimeout = null;

        function showNextPoem() {
            if (poemIndex >= poems.length || isComplete) return;

            const poem = poems[poemIndex];
            const poemText = document.getElementById('poemText');
            
            poemText.textContent = poem.text;
            poemText.classList.add('show');
            
            const nextDelay = poem.delay * 1000 + 2000;
            currentPoemTimeout = setTimeout(() => {
                poemText.classList.remove('show');
                poemIndex++;
                setTimeout(showNextPoem, 1000);
            }, nextDelay);
        }

        // ============================================
        // 5. CARRUSEL
        // ============================================
        let currentSlide = 0;
        let totalSlides = 0;
        let carouselInterval = null;
        let isDragging = false;
        let startX = 0;
        let startY = 0;
        let carouselInitialized = false;

        function initCarousel() {
            const track = document.getElementById('carouselTrack');
            const dotsContainer = document.getElementById('dotsContainer');
            
            track.innerHTML = '';
            carouselImages.forEach((img, index) => {
                const slide = document.createElement('div');
                slide.className = 'carousel-slide';
                slide.innerHTML = `
                    <div class="placeholder-image" style="background: linear-gradient(135deg, ${img.color}33, ${img.color}11); border-color: ${img.color}44;">
                        <div style="font-size: 4rem;">${img.emoji}</div>
                        <span style="color: ${img.color}; font-size: 0.8rem;">❤️ Recuerdo especial</span>
                    </div>
                    <div class="image-caption" style="color: ${img.color};">${img.caption}</div>
                `;
                track.appendChild(slide);
            });

            totalSlides = carouselImages.length;

            dotsContainer.innerHTML = '';
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('button');
                dot.className = 'dot' + (i === 0 ? ' active' : '');
                dot.dataset.index = i;
                dot.addEventListener('click', function() {
                    goToSlide(parseInt(this.dataset.index));
                });
                dotsContainer.appendChild(dot);
            }

            // Botones
            document.getElementById('prevBtn').addEventListener('click', function() {
                goToSlide(currentSlide - 1);
            });
            document.getElementById('nextBtn').addEventListener('click', function() {
                goToSlide(currentSlide + 1);
            });

            // Touch
            track.addEventListener('mousedown', startDrag);
            track.addEventListener('touchstart', startDragTouch, { passive: true });
            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', dragTouch, { passive: true });
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);

            startAutoPlay();
            updateCarousel();
            carouselInitialized = true;
        }

        function goToSlide(index) {
            if (totalSlides === 0) return;
            if (index < 0) index = totalSlides - 1;
            if (index >= totalSlides) index = 0;
            currentSlide = index;
            updateCarousel();
            resetAutoPlay();
        }

        function updateCarousel() {
            const track = document.getElementById('carouselTrack');
            track.style.transform = `translateX(-${currentSlide * 100}%)`;

            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === currentSlide);
            });
        }

        function startAutoPlay() {
            if (carouselInterval) clearInterval(carouselInterval);
            carouselInterval = setInterval(() => {
                goToSlide(currentSlide + 1);
            }, 3500);
        }

        function resetAutoPlay() {
            if (carouselInterval) {
                clearInterval(carouselInterval);
                carouselInterval = setInterval(() => {
                    goToSlide(currentSlide + 1);
                }, 3500);
            }
        }

        function stopAutoPlay() {
            if (carouselInterval) {
                clearInterval(carouselInterval);
                carouselInterval = null;
            }
        }

        function startDrag(e) {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            stopAutoPlay();
        }

        function startDragTouch(e) {
            isDragging = true;
            const touch = e.touches[0];
            startX = touch.clientX;
            startY = touch.clientY;
            stopAutoPlay();
        }

        function drag(e) {
            if (!isDragging) return;
            const diffX = e.clientX - startX;
            const diffY = e.clientY - startY;
            
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 30) {
                goToSlide(diffX > 0 ? currentSlide - 1 : currentSlide + 1);
                isDragging = false;
            }
        }

        function dragTouch(e) {
            if (!isDragging) return;
            const touch = e.touches[0];
            const diffX = touch.clientX - startX;
            const diffY = touch.clientY - startY;
            
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 30) {
                goToSlide(diffX > 0 ? currentSlide - 1 : currentSlide + 1);
                isDragging = false;
            }
        }

        function endDrag() {
            isDragging = false;
            if (!carouselInterval) {
                startAutoPlay();
            }
        }

        // ============================================
        // 6. CORAZONES FLOTANTES
        // ============================================
        let heartsInterval = null;

        function createFloatingHearts() {
            const container = document.getElementById('floatingHearts');
            const emojis = ['❤️', '💕', '💗', '💖', '💝', '💘'];
            
            if (heartsInterval) clearInterval(heartsInterval);
            
            heartsInterval = setInterval(() => {
                if (!document.getElementById('messageSection').classList.contains('visible')) return;
                
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.fontSize = (1 + Math.random() * 1.5) + 'rem';
                heart.style.animationDuration = (8 + Math.random() * 12) + 's';
                heart.style.animationDelay = (Math.random() * 3) + 's';
                
                container.appendChild(heart);
                setTimeout(() => heart.remove(), 15000);
            }, 1000);
        }

        // ============================================
        // 7. MENSAJE FINAL
        // ============================================
        function showFinalMessage() {
            const section = document.getElementById('messageSection');
            section.classList.add('visible');
            
            if (!carouselInitialized) {
                setTimeout(initCarousel, 500);
            }
            createFloatingHearts();
        }

        // ============================================
        // 8. LIMPIAR / REINICIAR
        // ============================================
        function cleanScreen() {
            if (isComplete) {
                progress = 0;
                isComplete = false;
                startTime = Date.now();
                poemIndex = 0;
                carouselInitialized = false;
                currentSlide = 0;
                
                document.getElementById('messageSection').classList.remove('visible');
                document.getElementById('poemText').classList.remove('show');
                
                if (currentPoemTimeout) {
                    clearTimeout(currentPoemTimeout);
                    currentPoemTimeout = null;
                }
                
                if (carouselInterval) {
                    clearInterval(carouselInterval);
                    carouselInterval = null;
                }
                
                if (heartsInterval) {
                    clearInterval(heartsInterval);
                    heartsInterval = null;
                }
                
                document.getElementById('floatingHearts').innerHTML = '';
                document.getElementById('progressFill').style.width = '0%';
                document.getElementById('progressPercent').textContent = '0%';
                
                setTimeout(showNextPoem, 1000);
            }
        }

        // ============================================
        // 9. INICIO
        // ============================================
        function init() {
            resizeCanvas();
            window.addEventListener('resize', () => {
                resizeCanvas();
            });
            document.getElementById('cleanBtn').addEventListener('click', cleanScreen);
            
            // Iniciar animación
            animate(0);
            setTimeout(showNextPoem, 1000);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
