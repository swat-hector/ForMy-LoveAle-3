<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


html,
body{
    width:100%;
    height:100%;
    overflow:hidden;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    background:#071018;
}


/* =====================================================
   CONTENEDOR
===================================================== */

.container{
    position:fixed;
    inset:0;

    width:100%;
    height:100vh;

    overflow:hidden;
}


/* =====================================================
   CANVAS
===================================================== */

canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    display:block;

    cursor:pointer;

    touch-action:none;
}


/* =====================================================
   INSTRUCCIONES
===================================================== */

.name{

    position:fixed;

    top:50%;
    left:50%;

    width:90%;

    transform:
        translate(-50%,-50%);

    color:#fff;

    text-align:center;

    font-size:
        clamp(24px,4vw,48px);

    text-shadow:

        0 0 10px #ff6bb5,

        0 0 30px rgba(255,70,160,.6);

    user-select:none;

    pointer-events:none;

    z-index:10;

    transition:opacity 1s ease;

    animation:pulseText 2s infinite;
}


.name small{

    display:block;

    margin-top:15px;

    font-family:
        Arial,
        sans-serif;

    font-size:
        clamp(14px,2vw,20px);

    color:#ffd5e7;

}


@keyframes pulseText{

    0%,
    100%{

        transform:
            translate(-50%,-50%)
            scale(1);

        opacity:.75;

    }


    50%{

        transform:
            translate(-50%,-50%)
            scale(1.04);

        opacity:1;

    }

}


/* =====================================================
   POEMAS
===================================================== */

.poem-box{

    position:fixed;

    top:7%;

    left:50%;

    transform:
        translateX(-50%);

    width:min(88%,850px);

    text-align:center;

    z-index:20;

    pointer-events:none;

}


.poem{

    min-height:80px;

    color:#fff5fa;

    font-size:
        clamp(19px,2.4vw,33px);

    line-height:1.5;

    opacity:0;

    transform:
        translateY(20px);

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;

    text-shadow:

        0 0 10px rgba(255,100,180,.8),

        0 0 30px rgba(255,80,150,.4);

}


.poem.show{

    opacity:1;

    transform:
        translateY(0);

}


/* =====================================================
   BARRA DE PROGRESO
===================================================== */

.progress-container{

    width:280px;

    max-width:70%;

    height:5px;

    margin:20px auto;

    border-radius:20px;

    overflow:hidden;

    background:
        rgba(255,255,255,.18);

}


.progress{

    width:0%;

    height:100%;

    border-radius:20px;

    background:

        linear-gradient(
            90deg,
            #ff5fa2,
            #ffd0e4
        );

    box-shadow:

        0 0 15px #ff4f9c;

}


/* =====================================================
   BOTÓN REINICIAR
===================================================== */

.clean-btn{

    position:fixed;

    left:20px;
    bottom:20px;

    z-index:30;

    border:none;

    border-radius:25px;

    padding:
        10px 18px;

    color:#fff;

    background:
        rgba(0,0,0,.35);

    backdrop-filter:
        blur(10px);

    font-size:14px;

    cursor:pointer;

    transition:.3s;

}


.clean-btn:hover{

    transform:
        scale(1.08);

    background:
        rgba(255,80,150,.35);

}


/* =====================================================
   PANTALLA FINAL
===================================================== */

.final-screen{

    position:fixed;

    inset:0;

    z-index:100;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    background:
        rgba(5,8,15,.96);

    backdrop-filter:
        blur(15px);

    opacity:0;

    pointer-events:none;

    transition:2s ease;

}


.final-screen.show{

    opacity:1;

    pointer-events:auto;

}


.final-content{

    width:
        min(92%,750px);

    text-align:center;

}


.final-content h1{

    color:#ff78b5;

    font-size:
        clamp(38px,7vw,70px);

    text-shadow:

        0 0 20px #ff3f91,

        0 0 60px rgba(255,40,150,.7);

}


.final-content h2{

    margin:
        15px 0 30px;

    color:#fff0f6;

    font-weight:normal;

}


/* =====================================================
   CARRUSEL
===================================================== */

.carousel{

    position:relative;

    width:100%;

    overflow:hidden;

    border-radius:25px;

    background:#111;

    box-shadow:
        0 0 50px rgba(255,80,160,.25);

}


.track{

    display:flex;

    transition:
        transform .7s ease;

}


.slide{

    min-width:100%;

}


.slide img{

    width:100%;

    height:
        min(55vh,430px);

    object-fit:cover;

    display:block;

}


.caption{

    padding:15px;

    color:#ffe5f1;

    font-size:18px;

}


/* =====================================================
   BOTONES CARRUSEL
===================================================== */

.carousel button{

    position:absolute;

    top:50%;

    transform:
        translateY(-50%);

    width:50px;

    height:50px;

    border:none;

    border-radius:50%;

    color:white;

    background:
        rgba(0,0,0,.5);

    font-size:35px;

    cursor:pointer;

    z-index:5;

}


.prev{
    left:10px;
}


.next{
    right:10px;
}


/* =====================================================
   PUNTOS
===================================================== */

.dots{

    display:flex;

    justify-content:center;

    gap:10px;

    margin-top:18px;

}


.dot{

    width:10px;
    height:10px;

    border-radius:50%;

    background:#555;

    cursor:pointer;

    transition:.3s;

}


.dot.active{

    background:#ff5ca8;

    box-shadow:
        0 0 15px #ff5ca8;

}


</style>

<script>


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("canvas");


const ctx =
    canvas.getContext("2d");


function resizeCanvas(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}


resizeCanvas();


window.addEventListener(
    "resize",
    resizeCanvas
);



/* =====================================================
   VARIABLES
===================================================== */

let flowers = [];

let particles = [];

let startTime =
    Date.now();

let experienceFinished =
    false;

let currentPoem =
    -1;



/* =====================================================
   DURACIÓN TOTAL

   Aproximadamente 55 segundos
===================================================== */

const EXPERIENCE_TIME =
    55000;



/* =====================================================
   POEMAS
===================================================== */

const poems = [

    "🌱 Todo comenzó como una pequeña semilla...",

    "🌿 Y poco a poco, contigo, algo hermoso comenzó a crecer.",

    "🌸 Cada momento a tu lado hizo florecer mi corazón.",

    "💖 Porque en el jardín de mi vida, tú eres una de las flores más bonitas.",

    "❤️ Seis meses contigo y deseo que sean muchos más.",

    "🌸 Te amo Ale... y quiero seguir haciendo florecer nuestro jardín juntos. 🌸"

];


const poemEl =
    document.getElementById("poem");



function showPoem(index){


    poemEl.classList.remove(
        "show"
    );


    setTimeout(()=>{

        poemEl.textContent =
            poems[index];


        poemEl.classList.add(
            "show"
        );

    },500);

}



/* =====================================================
   ELEGIR TIPO DE FLOR

   65% LIRIOS
===================================================== */

function getFlowerType(){

    const random =
        Math.random();


    if(random < 0.65){

        return "lily";

    }


    if(random < 0.80){

        return "tulip";

    }


    if(random < 0.92){

        return "daisy";

    }


    return "wild";

}



/* =====================================================
   COLORES
===================================================== */

function getRandomFlowerColor(type){

    const colors = {


        lily:[

            "#ffffff",

            "#ffe0ef",

            "#ffc0dc",

            "#f5d4ff",

            "#fff4f8"

        ],


        tulip:[

            "#ff5c8d",

            "#ff709f",

            "#ff9abe",

            "#e14c7b"

        ],


        daisy:[

            "#ffffff",

            "#fff7df",

            "#ffe8f0"

        ],


        wild:[

            "#a980ff",

            "#ff7eb3",

            "#ffb347",

            "#ff6b9d"

        ]

    };


    const list =
        colors[type];


    return list[
        Math.floor(
            Math.random()*list.length
        )
    ];

}



function getFlowerAccent(type){

    const accents={


        lily:"#c2185b",


        tulip:"#a61b50",


        daisy:"#f0a500",


        wild:"#7b2cbf"

    };


    return accents[type];

}



/* =====================================================
   CREAR FLOR
===================================================== */

function createFlower(x,y){


    if(experienceFinished)
        return;


    /*
       Evitar demasiadas flores exactamente
       en el mismo lugar.
    */

    let finalX=x;

    let finalY=y;


    for(const flower of flowers){


        const distance =
            Math.hypot(

                finalX-flower.x,

                finalY-flower.y

            );


        /*
           Si está demasiado cerca,
           la movemos ligeramente.
        */

        if(distance < 45){

            finalX +=
                (Math.random()-.5)*55;


            finalY +=
                (Math.random()-.5)*25;

        }

    }


    /*
       Evitar que se salga de pantalla.
    */

    finalX =
        Math.max(
            20,
            Math.min(
                canvas.width-20,
                finalX
            )
        );


    finalY =
        Math.max(
            60,
            Math.min(
                canvas.height-20,
                finalY
            )
        );


    const type =
        getFlowerType();



    /*
       TAMAÑO PEQUEÑO Y VARIABLE

       Mínimo: 13px
       Máximo: 27px

       Ninguna flor será gigante.
    */

    const size =
        13+
        Math.random()*14;



    /*
       TALLOS MÁS CORTOS

       Mínimo: 45px
       Máximo: 100px
    */

    const height =
        45+
        Math.random()*55;



    flowers.push({


        x:finalX,

        y:finalY,


        type:type,


        height:height,


        size:size,


        progress:0,


        speed:

            0.0018+

            Math.random()*0.0015,


        color:
            getRandomFlowerColor(type),


        accent:
            getFlowerAccent(type),


        wind:
            Math.random()*10


    });



    /*
       PARTÍCULAS
    */

    createParticles(

        finalX,

        finalY,

        16

    );


}



/* =====================================================
   PARTÍCULAS
===================================================== */

function createParticles(x,y,amount){


    for(let i=0;i<amount;i++){


        particles.push({


            x:x,

            y:y,


            vx:
                (Math.random()-.5)*2.5,


            vy:
                (Math.random()-.5)*2.5-1,


            size:
                Math.random()*3+1,


            life:1,


            decay:
                .015+
                Math.random()*.02


        });


    }


}



function updateParticles(){


    for(let i=particles.length-1;i>=0;i--){


        const p=
            particles[i];


        p.x+=p.vx;

        p.y+=p.vy;

        p.vy+=.02;

        p.life-=p.decay;



        ctx.beginPath();


        ctx.arc(

            p.x,

            p.y,

            p.size,

            0,

            Math.PI*2

        );


        ctx.fillStyle=
            `rgba(255,210,230,${Math.max(0,p.life)})`;


        ctx.fill();



        if(p.life<=0){

            particles.splice(
                i,
                1
            );

        }

    }


}



/* =====================================================
   DIBUJAR TALLO
===================================================== */

function drawStem(flower){


    const growth =
        Math.min(
            flower.progress*2.2,
            1
        );


    const height =
        flower.height*growth;


    const wind =

        Math.sin(

            Date.now()/1200+
            flower.wind

        )*3;



    ctx.beginPath();


    ctx.moveTo(

        flower.x,

        flower.y

    );


    ctx.quadraticCurveTo(

        flower.x+wind,

        flower.y-height*.5,

        flower.x+wind*.5,

        flower.y-height

    );


    ctx.strokeStyle=
        "#3f8248";


    ctx.lineWidth=
        Math.max(
            1.8,
            flower.size*.11
        );


    ctx.lineCap=
        "round";


    ctx.stroke();



    /* =====================================
       HOJAS PEQUEÑAS
    ===================================== */

    if(flower.progress>.28){


        const leafY=

            flower.y-

            height*.45;



        ctx.fillStyle=
            "#4c914f";



        drawLeaf(

            flower.x,

            leafY,

            -1,

            9+flower.size*.35

        );



        drawLeaf(

            flower.x,

            leafY+7,

            1,

            8+flower.size*.3

        );

    }


}



/* =====================================================
   DIBUJAR HOJA
===================================================== */

function drawLeaf(
    x,
    y,
    direction,
    size
){


    ctx.beginPath();


    ctx.moveTo(
        x,
        y
    );


    ctx.quadraticCurveTo(

        x+direction*size*.6,

        y-size*.45,

        x+direction*size,

        y-size*.08

    );


    ctx.quadraticCurveTo(

        x+direction*size*.5,

        y+size*.18,

        x,

        y

    );


    ctx.fill();


}



/* =====================================================
   ELEGIR FLOR PARA DIBUJAR
===================================================== */

function drawFlower(flower){


    switch(flower.type){


        case "lily":

            drawLily(flower);

        break;



        case "tulip":

            drawTulip(flower);

        break;



        case "daisy":

            drawDaisy(flower);

        break;



        case "wild":

            drawWildFlower(flower);

        break;


    }


}



/* =====================================================
   🌸 LIRIO
===================================================== */

function drawLily(flower){


    if(flower.progress<.4)
        return;



    const bloom=

        Math.min(

            (flower.progress-.4)*2.2,

            1

        );



    const topY=

        flower.y-

        flower.height;



    /*
       TAMAÑO CONTROLADO
    */

    const size=

        flower.size*

        (.45+bloom*.65);



    ctx.save();


    ctx.translate(

        flower.x,

        topY

    );


    ctx.globalAlpha=
        bloom;



    /*
       SEIS PÉTALOS
    */

    for(let i=0;i<6;i++){


        ctx.save();


        ctx.rotate(

            i*Math.PI/3

        );



        const gradient=

            ctx.createLinearGradient(

                0,

                0,

                0,

                -size*1.7

            );



        gradient.addColorStop(

            0,

            flower.accent

        );


        gradient.addColorStop(

            .55,

            flower.color

        );


        gradient.addColorStop(

            1,

            "#fffaff"

        );



        ctx.fillStyle=
            gradient;



        ctx.beginPath();


        ctx.moveTo(0,0);



        ctx.bezierCurveTo(

            size*.65,

            -size*.25,

            size*.58,

            -size*1.25,

            0,

            -size*1.7

        );



        ctx.bezierCurveTo(

            -size*.58,

            -size*1.25,

            -size*.65,

            -size*.25,

            0,

            0

        );



        ctx.fill();


        ctx.restore();

    }



    /*
       CENTRO
    */

    ctx.beginPath();


    ctx.arc(

        0,

        0,

        size*.16,

        0,

        Math.PI*2

    );


    ctx.fillStyle=
        "#ffd166";


    ctx.fill();



    /*
       ESTAMBRES
    */

    for(let i=0;i<6;i++){


        const angle=

            i*Math.PI/3;



        const length=

            size*.72;



        ctx.beginPath();


        ctx.moveTo(0,0);


        ctx.lineTo(

            Math.cos(angle)*length,

            Math.sin(angle)*length

        );


        ctx.strokeStyle=
            "#9b6429";


        ctx.lineWidth=1.2;


        ctx.stroke();



        ctx.beginPath();


        ctx.arc(

            Math.cos(angle)*length,

            Math.sin(angle)*length,

            1.8,

            0,

            Math.PI*2

        );


        ctx.fillStyle=
            "#d99a35";


        ctx.fill();

    }


    ctx.restore();

}



/* =====================================================
   🌷 TULIPÁN
===================================================== */

function drawTulip(flower){


    if(flower.progress<.42)
        return;


    const bloom=

        Math.min(

            (flower.progress-.42)*2,

            1

        );


    const topY=

        flower.y-

        flower.height;


    const size=

        flower.size*bloom;



    ctx.save();


    ctx.translate(

        flower.x,

        topY

    );


    ctx.globalAlpha=
        bloom;


    ctx.fillStyle=
        flower.color;



    ctx.beginPath();


    ctx.moveTo(
        -size*.8,
        0
    );


    ctx.quadraticCurveTo(

        -size,
        -size*1.1,

        -size*.4,
        -size*1.5

    );


    ctx.quadraticCurveTo(

        0,
        -size*1.1,

        size*.4,
        -size*1.5

    );


    ctx.quadraticCurveTo(

        size,
        -size*1.1,

        size*.8,
        0

    );


    ctx.closePath();


    ctx.fill();


    ctx.restore();

}



/* =====================================================
   🌼 MARGARITA
===================================================== */

function drawDaisy(flower){


    if(flower.progress<.42)
        return;


    const bloom=

        Math.min(

            (flower.progress-.42)*2,

            1

        );


    const topY=

        flower.y-

        flower.height;


    const size=

        flower.size*.9*bloom;



    ctx.save();


    ctx.translate(

        flower.x,

        topY

    );


    ctx.globalAlpha=
        bloom;



    for(let i=0;i<10;i++){


        ctx.save();


        ctx.rotate(

            i*Math.PI/5

        );


        ctx.fillStyle=
            flower.color;



        ctx.beginPath();


        ctx.ellipse(

            0,

            -size*.65,

            size*.26,

            size*.65,

            0,

            0,

            Math.PI*2

        );


        ctx.fill();


        ctx.restore();

    }



    ctx.beginPath();


    ctx.arc(

        0,

        0,

        size*.3,

        0,

        Math.PI*2

    );


    ctx.fillStyle=
        "#ffd166";


    ctx.fill();


    ctx.restore();

}



/* =====================================================
   🌺 FLOR SILVESTRE
===================================================== */

function drawWildFlower(flower){


    if(flower.progress<.42)
        return;


    const bloom=

        Math.min(

            (flower.progress-.42)*2,

            1

        );


    const topY=

        flower.y-

        flower.height;


    const size=

        flower.size*.85*bloom;



    ctx.save();


    ctx.translate(

        flower.x,

        topY

    );


    ctx.globalAlpha=
        bloom;



    for(let i=0;i<5;i++){


        ctx.save();


        ctx.rotate(

            i*(Math.PI*2/5)

        );


        ctx.fillStyle=
            flower.color;



        ctx.beginPath();


        ctx.arc(

            0,

            -size*.55,

            size*.48,

            0,

            Math.PI*2

        );


        ctx.fill();


        ctx.restore();

    }



    ctx.beginPath();


    ctx.arc(

        0,

        0,

        size*.25,

        0,

        Math.PI*2

    );


    ctx.fillStyle=
        "#ffe066";


    ctx.fill();


    ctx.restore();

}



/* =====================================================
   FONDO DEL JARDÍN
===================================================== */

function drawBackground(){


    const gradient=

        ctx.createLinearGradient(

            0,

            0,

            0,

            canvas.height

        );



    gradient.addColorStop(

        0,

        "#07111d"

    );


    gradient.addColorStop(

        .55,

        "#142933"

    );


    gradient.addColorStop(

        1,

        "#16351d"

    );


    ctx.fillStyle=
        gradient;


    ctx.fillRect(

        0,

        0,

        canvas.width,

        canvas.height

    );



    /*
       ESTRELLAS
    */

    for(let i=0;i<45;i++){


        const x=

            (i*137)%

            canvas.width;



        const y=

            (i*73)%

            (canvas.height*.55);



        const pulse=

            .3+

            Math.sin(

                Date.now()/1000+i

            )*.15;



        ctx.beginPath();


        ctx.arc(

            x,

            y,

            1,

            0,

            Math.PI*2

        );


        ctx.fillStyle=

            `rgba(255,255,255,${pulse})`;


        ctx.fill();

    }


}



/* =====================================================
   ACTUALIZAR EXPERIENCIA
===================================================== */

function updateExperience(){


    const elapsed=

        Date.now()-startTime;



    const percentage=

        Math.min(

            elapsed/

            EXPERIENCE_TIME,

            1

        );



    document
        .getElementById("progress")
        .style.width=

            (percentage*100)+"%";



    const poemIndex=

        Math.min(

            Math.floor(

                percentage*
                poems.length

            ),

            poems.length-1

        );



    if(poemIndex!==currentPoem){


        currentPoem=
            poemIndex;


        showPoem(
            currentPoem
        );

    }



    if(

        percentage>=1 &&

        !experienceFinished

    ){


        experienceFinished=true;



        setTimeout(

            showFinalScreen,

            1200

        );

    }


}



/* =====================================================
   ANIMACIÓN
===================================================== */

function animate(){


    drawBackground();



    flowers.forEach(flower=>{


        flower.progress+=
            flower.speed;


        flower.progress=
            Math.min(

                flower.progress,

                1

            );



        drawStem(flower);


        drawFlower(flower);


    });



    updateParticles();


    if(!experienceFinished){

        updateExperience();

    }



    requestAnimationFrame(
        animate
    );

}


animate();

/* =====================================================
   CARRUSEL DE FOTOS
===================================================== */


/*
    CAMBIA ESTAS RUTAS
    POR TUS PROPIAS FOTOS
*/

const images=[


    {

        src:"images/972a18d4-5852-41a3-a29f-b39289947f4b.jpeg",

        text:"❤️ Nuestro primer recuerdo"

    },


    {

        src:"images/b01c638a-a57c-475d-a456-5690d9ca3d2a.jpeg",

        text:"🌸 Momentos que siempre recordaré"

    },


    {

        src:"images/fe9422b3-16bf-4309-a664-3f5a6a4a280d.jpeg",

        text:"💖 Tú haces mi vida más bonita"

    },


    {

        src:"images/262e46c9-8d04-472c-96be-9b967b57a7f2.jpeg",

        text:"✨ Por muchos momentos más juntos"

    }


];


let slideIndex=0;


const track=

    document.getElementById("track");


const dots=

    document.getElementById("dots");



images.forEach(

    (image,index)=>{


        const slide=

            document.createElement("div");


        slide.className=
            "slide";



        slide.innerHTML=`

            <img
                src="${image.src}"
                alt="Nuestro recuerdo"
            >

            <div class="caption">

                ${image.text}

            </div>

        `;



        track.appendChild(
            slide
        );



        const dot=

            document.createElement(
                "div"
            );


        dot.className=

            index===0

                ? "dot active"

                : "dot";



        dot.addEventListener(

            "click",

            ()=>{

                goToSlide(
                    index
                );

            }

        );



        dots.appendChild(
            dot
        );


    }

);



function goToSlide(index){


    if(index<0){

        index=
            images.length-1;

    }


    if(index>=images.length){

        index=0;

    }


    slideIndex=index;



    track.style.transform=

        `translateX(-${index*100}%)`;



    document
        .querySelectorAll(".dot")
        .forEach(

            (dot,i)=>{


                dot.classList.toggle(

                    "active",

                    i===index

                );


            }

        );


}



/* =====================================================
   BOTONES DEL CARRUSEL
===================================================== */

document
    .getElementById("prevBtn")
    .addEventListener(

        "click",

        ()=>{

            goToSlide(

                slideIndex-1

            );

        }

    );



document
    .getElementById("nextBtn")
    .addEventListener(

        "click",

        ()=>{

            goToSlide(

                slideIndex+1

            );

        }

    );



/* =====================================================
   MOSTRAR CARRUSEL
===================================================== */

function showFinalScreen(){


    document
        .getElementById("instruction")
        .style.display=
            "none";


    document
        .getElementById("finalScreen")
        .classList.add(
            "show"
        );


}

===================================================== */

showPoem(0);

currentPoem=0;
