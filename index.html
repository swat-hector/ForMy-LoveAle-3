        }

            color: #ff91c5;

            font-weight: bold;

        }


        .heart {

            display: inline-block;

        }

            0%, 100% {

            }

            50% {
                transform: scale(1.25);
            }

            height: 100%;

            border-radius: 20px;

                    #ff3f93,
                    #ffd1e5

/* ========================================= */
/* FUNCIONES AUXILIARES */
/* ========================================= */


function clamp(value, min = 0, max = 1) {

    return Math.max(
        min,
        Math.min(max, value)
    );

}


function smoothStep(value) {

    value = clamp(value);

    return value *
        value *
        (3 - 2 * value);

}



/* ========================================= */
/* DIBUJAR TALLO */
/* ========================================= */


function drawLilyStem(
    x,
    baseY,
    height,
    growth,
    wind
) {

    const visibleHeight =
        height *
        smoothStep(growth);


    ctx.save();


    ctx.lineCap = "round";


    const gradient =
        ctx.createLinearGradient(
            x,
            baseY,
            x,
            baseY - visibleHeight
        );


    gradient.addColorStop(
        0,
        "#153f26"
    );

    gradient.addColorStop(
        0.5,
        "#2f7d46"
    );

    gradient.addColorStop(
        1,
        "#7ebf6a"
    );


    ctx.strokeStyle = gradient;

    ctx.lineWidth =
        Math.max(
            4,
            height * 0.025
        );


    ctx.beginPath();


    ctx.moveTo(
        x,
        baseY
    );


    ctx.bezierCurveTo(

        x + wind * 0.2,

        baseY - visibleHeight * 0.30,


        x - wind * 0.4,

        baseY - visibleHeight * 0.65,


        x + wind,

        baseY - visibleHeight

    );


    ctx.stroke();


    ctx.restore();

}



/* ========================================= */
/* HOJAS DEL LIRIO */
/* ========================================= */


function drawLilyLeaf(
    x,
    y,
    length,
    angle,
    growth
) {

    const g =
        smoothStep(growth);


    if (g <= 0) return;


    ctx.save();


    ctx.translate(x, y);

    ctx.rotate(angle);


    const visibleLength =
        length * g;


    const width =
        visibleLength * 0.14;


    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            visibleLength,
            0
        );


    gradient.addColorStop(
        0,
        "#1b542d"
    );

    gradient.addColorStop(
        0.5,
        "#469451"
    );

    gradient.addColorStop(
        1,
        "#88c96a"
    );


    ctx.beginPath();


    ctx.moveTo(0, 0);


    ctx.bezierCurveTo(

        visibleLength * 0.30,
        -width,

        visibleLength * 0.70,
        -width * 0.6,

        visibleLength,
        0

    );


    ctx.bezierCurveTo(

        visibleLength * 0.70,
        width * 0.6,

        visibleLength * 0.30,
        width,

        0,
        0

    );


    ctx.fillStyle = gradient;

    ctx.fill();


    /* Nervadura */


    ctx.beginPath();

    ctx.moveTo(0, 0);

    ctx.lineTo(
        visibleLength,
        0
    );


    ctx.strokeStyle =
        "rgba(20,70,30,0.4)";

    ctx.lineWidth = 1;

    ctx.stroke();


    ctx.restore();

}



/* ========================================= */
/* CAPULLO */
/* ========================================= */


function drawLilyBud(
    x,
    y,
    size,
    color,
    progress
) {

    const g =
        smoothStep(progress);


    ctx.save();


    ctx.translate(x, y);

    ctx.scale(g, g);


    /* Base verde */


    ctx.fillStyle = "#4c8a4e";


    ctx.beginPath();


    ctx.ellipse(

        0,

        size * 0.20,

        size * 0.30,

        size * 0.45,

        0,

        0,

        Math.PI * 2

    );


    ctx.fill();



    /* Capullo */


    const gradient =
        ctx.createLinearGradient(
            0,
            -size,
            0,
            size
        );


    gradient.addColorStop(
        0,
        "#ffffff"
    );

    gradient.addColorStop(
        0.5,
        color
    );

    gradient.addColorStop(
        1,
        "#c2185b"
    );


    ctx.fillStyle = gradient;


    ctx.beginPath();


    ctx.moveTo(
        0,
        -size * 0.90
    );


    ctx.bezierCurveTo(

        size * 0.55,
        -size * 0.40,

        size * 0.45,
        size * 0.35,

        0,
        size * 0.65

    );


    ctx.bezierCurveTo(

        -size * 0.45,
        size * 0.35,

        -size * 0.55,
        -size * 0.40,

        0,
        -size * 0.90

    );


    ctx.fill();


    ctx.restore();

}



/* ========================================= */
/* PÉTALO DEL LIRIO */
/* ========================================= */


function drawLilyPetal(
    angle,
    length,
    width,
    color,
    accent,
    openness
) {

    ctx.save();


    ctx.rotate(angle);


    const open =
        openness *
        length *
        0.40;


    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            -length
        );


    gradient.addColorStop(
        0,
        accent
    );

    gradient.addColorStop(
        0.30,
        color
    );

    gradient.addColorStop(
        0.75,
        "#fff5f9"
    );

    gradient.addColorStop(
        1,
        "#ffffff"
    );


    ctx.fillStyle = gradient;


    ctx.beginPath();


    ctx.moveTo(0, 0);


    ctx.bezierCurveTo(

        width * 0.25,
        -length * 0.15,

        width,
        -length * 0.55,

        width * 0.65,
        -length

    );


    ctx.quadraticCurveTo(

        open * 0.15,
        -length * 1.20,

        0,
        -length * 1.28

    );


    ctx.quadraticCurveTo(

        -open * 0.15,
        -length * 1.20,

        -width * 0.65,
        -length

    );


    ctx.bezierCurveTo(

        -width,
        -length * 0.55,

        -width * 0.25,
        -length * 0.15,

        0,
        0

    );


    ctx.closePath();


    ctx.fill();



    /* Borde */


    ctx.strokeStyle =
        "rgba(150,30,80,0.25)";

    ctx.lineWidth = 1;

    ctx.stroke();



    /* Nervadura */


    ctx.beginPath();


    ctx.moveTo(0, 0);


    ctx.quadraticCurveTo(

        width * 0.08,

        -length * 0.60,

        0,

        -length * 1.12

    );


    ctx.strokeStyle = accent;

    ctx.globalAlpha = 0.35;

    ctx.lineWidth = 1.2;

    ctx.stroke();



    /* MANCHAS DEL LIRIO */


    ctx.globalAlpha = 0.35;


    for (let i = 0; i < 5; i++) {


        const px =
            Math.sin(
                i * 2.8 + angle
            ) *
            width *
            0.35;


        const py =
            -length *
            (
                0.35 +
                i * 0.11
            );


        ctx.beginPath();


        ctx.arc(

            px,

            py,

            Math.max(
                1.5,
                width * 0.07
            ),

            0,

            Math.PI * 2

        );


        ctx.fillStyle = "#861541";

        ctx.fill();

    }


    ctx.restore();

}



/* ========================================= */
/* LIRIO COMPLETO */
/* ========================================= */


function drawRealisticLily(
    x,
    y,
    size,
    color,
    accent,
    bloomProgress,
    wind
) {


    const bloom =
        smoothStep(bloomProgress);


    if (bloom <= 0) return;


    ctx.save();


    ctx.translate(x, y);

    ctx.rotate(wind);



    /* ===================================== */
    /* 6 PÉTALOS */
    /* ===================================== */


    const petalCount = 6;


    for (
        let i = 0;
        i < petalCount;
        i++
    ) {


        const angle =
            (Math.PI * 2 / petalCount)
            * i;


        const petalLength =
            size *
            (
                0.95 +
                (i % 2) * 0.12
            );


        const petalWidth =
            size * 0.32;


        drawLilyPetal(

            angle,

            petalLength,

            petalWidth,

            color,

            accent,

            bloom

        );

    }



    /* ===================================== */
    /* ESTAMBRES */
    /* ===================================== */


    ctx.save();


    ctx.globalAlpha = bloom;


    for (let i = 0; i < 6; i++) {


        const angle =
            (Math.PI * 2 / 6) *
            i;


        const length =
            size * 0.48;


        const sx =
            Math.cos(angle) *
            length;


        const sy =
            Math.sin(angle) *
            length;



        /* Filamento */


        ctx.beginPath();


        ctx.moveTo(0, 0);


        ctx.quadraticCurveTo(

            sx * 0.5,

            sy * 0.5,

            sx,

            sy

        );


        ctx.strokeStyle = "#8d6b2c";

        ctx.lineWidth =
            Math.max(
                1.5,
                size * 0.025
            );


        ctx.stroke();



        /* Antera */


        ctx.beginPath();


        ctx.ellipse(

            sx,

            sy,

            size * 0.07,

            size * 0.035,

            angle,

            0,

            Math.PI * 2

        );


        ctx.fillStyle = "#a56b20";

        ctx.fill();

    }


    ctx.restore();



    /* ===================================== */
    /* CENTRO */
    /* ===================================== */


    const centerGradient =
        ctx.createRadialGradient(

            0,

            0,

            1,

            0,

            0,

            size * 0.18

        );


    centerGradient.addColorStop(
        0,
        "#fff7c2"
    );


    centerGradient.addColorStop(
        0.5,
        "#f6c453"
    );


    centerGradient.addColorStop(
        1,
        "#a76b18"
    );


    ctx.beginPath();


    ctx.arc(

        0,

        0,

        size * 0.16,

        0,

        Math.PI * 2

    );


    ctx.fillStyle = centerGradient;

    ctx.fill();


    ctx.restore();

}



/* ========================================= */
/* PLANTA COMPLETA */
/* ========================================= */


function drawLilyPlant(
    lily,
    progress,
    w,
    h,
    index
) {


    const localProgress =
        clamp(
            (
                progress -
                lily.delay
            ) /
            (
                1 -
                lily.delay
            )
        );


    if (localProgress <= 0) return;



    const groundY =
        h * 0.94;


    const plantX =
        w * lily.x;


    const maxHeight =
        h *
        lily.height *
        lily.scale;



    /* ===================================== */
    /* VIENTO */
    /* ===================================== */


    const wind =
        Math.sin(
            Date.now() / 1600 +
            index * 1.5
        ) * 8;



    /* ===================================== */
    /* TALLO */
    /* ===================================== */


    const stemProgress =
        clamp(
            localProgress / 0.42
        );


    drawLilyStem(

        plantX,

        groundY,

        maxHeight,

        stemProgress,

        wind

    );


    const topY =
        groundY -

        maxHeight *
        smoothStep(stemProgress);



    /* ===================================== */
    /* HOJAS */
    /* ===================================== */


    const leafProgress =
        clamp(
            (
                localProgress -
                0.18
            ) /
            0.35
        );


    if (leafProgress > 0) {


        drawLilyLeaf(

            plantX,

            groundY -
            maxHeight * 0.20,

            maxHeight * 0.65,

            -0.70,

            leafProgress

        );


        drawLilyLeaf(

            plantX,

            groundY -
            maxHeight * 0.34,

            maxHeight * 0.55,

            0.70,

            leafProgress

        );


        drawLilyLeaf(

            plantX,

            groundY -
            maxHeight * 0.50,

            maxHeight * 0.42,

            -0.45,

            leafProgress

        );

    }



    /* ===================================== */
    /* CAPULLO */
    /* ===================================== */


    const budProgress =
        clamp(
            (
                localProgress -
                0.42
            ) /
            0.22
        );


    if (
        budProgress > 0 &&
        budProgress < 1
    ) {


        drawLilyBud(

            plantX + wind,

            topY,

            maxHeight * 0.18,

            lily.color,

            budProgress

        );

    }



    /* ===================================== */
    /* FLOR */
    /* ===================================== */


    const bloomProgress =
        clamp(
            (
                localProgress -
                0.58
            ) /
            0.42
        );


    if (bloomProgress > 0) {


        const flowerSize =
            Math.min(w, h) *
            0.065 *
            lily.scale;


        drawRealisticLily(

            plantX + wind,

            topY,

            flowerSize,

            lily.color,

            lily.accent,

            bloomProgress,

            wind * 0.01

        );

    }

}



/* ========================================= */
/* SUELO DEL JARDÍN */
/* ========================================= */


function drawGardenGround(
    w,
    h,
    progress
) {


    const groundProgress =
        smoothStep(
            clamp(progress * 3)
        );


    const groundHeight =
        h *
        0.18 *
        groundProgress;


    const gradient =
        ctx.createLinearGradient(

            0,

            h - groundHeight,

            0,

            h

        );


    gradient.addColorStop(
        0,
        "#35663a"
    );

    gradient.addColorStop(
        0.40,
        "#21452a"
    );

    gradient.addColorStop(
        1,
        "#0c2014"
    );


    ctx.fillStyle = gradient;


    ctx.beginPath();


    ctx.moveTo(0, h);


    for (
        let x = 0;
        x <= w;
        x += 20
    ) {


        const wave =
            Math.sin(x * 0.018) *
            7;


        ctx.lineTo(

            x,

            h -
            groundHeight +
            wave

        );

    }


    ctx.lineTo(w, h);

    ctx.closePath();

    ctx.fill();



    /* ===================================== */
    /* HIERBA */
    /* ===================================== */


    if (progress > 0.15) {


        ctx.save();


        ctx.globalAlpha =
            Math.min(
                0.9,
                progress * 1.3
            );


        for (let i = 0; i < 90; i++) {


            const x =
                (
                    i * 97.31
                ) % w;


            const y =
                h -
                groundHeight +
                (
                    i * 31.7 %
                    groundHeight
                );


            ctx.beginPath();


            ctx.moveTo(
                x,
                y + 8
            );


            ctx.lineTo(

                x +
                Math.sin(i * 3) * 4,

                y

            );


            ctx.strokeStyle =
                i % 2 === 0
                    ? "#4d914b"
                    : "#356e3b";


            ctx.lineWidth = 1.2;

            ctx.stroke();

        }


        ctx.restore();

    }

}



/* ========================================= */
/* ESCENA COMPLETA */
/* ========================================= */


function drawScene(progress) {


    const w =
        canvas.width;


    const h =
        canvas.height;



    /* ===================================== */
    /* CIELO */
    /* ===================================== */


    const sky =
        ctx.createLinearGradient(

            0,

            0,

            0,

            h

        );


    sky.addColorStop(
        0,
        "#07111c"
    );

    sky.addColorStop(
        0.30,
        "#142638"
    );

    sky.addColorStop(
        0.65,
        "#473d55"
    );

    sky.addColorStop(
        1,
        "#263b2b"
    );


    ctx.fillStyle = sky;

    ctx.fillRect(
        0,
        0,
        w,
        h
    );



    /* ===================================== */
    /* LUZ MÁGICA */
    /* ===================================== */


    const glow =
        ctx.createRadialGradient(

            w * 0.5,

            h * 0.20,

            0,


            w * 0.5,

            h * 0.20,

            w * 0.55

        );


    glow.addColorStop(

        0,

        "rgba(255,210,235,0.18)"

    );


    glow.addColorStop(

        0.40,

        "rgba(255,150,210,0.06)"

    );


    glow.addColorStop(

        1,

        "rgba(255,150,210,0)"

    );


    ctx.fillStyle = glow;

    ctx.fillRect(
        0,
        0,
        w,
        h
    );



    /* ===================================== */
    /* ESTRELLAS */
    /* ===================================== */


    const time =
        Date.now() / 1000;


    for (let i = 0; i < 50; i++) {


        const x =
            (i * 137.5) % w;


        const y =
            (i * 73.2) %
            (h * 0.62);


        const alpha =
            0.25 +

            Math.sin(
                time * 2 + i
            ) *
            0.18;


        ctx.beginPath();


        ctx.arc(

            x,

            y,

            1 + (i % 3) * 0.4,

            0,

            Math.PI * 2

        );


        ctx.fillStyle =
            `rgba(255,235,245,${alpha})`;


        ctx.fill();

    }



    /* ===================================== */
    /* SUELO */
    /* ===================================== */


    drawGardenGround(
        w,
        h,
        progress
    );



    /* ===================================== */
    /* CRECER JARDÍN */
    /* ===================================== */


    gardenLilies.forEach(

        (
            lily,
            index
        ) => {


            drawLilyPlant(

                lily,

                progress,

                w,

                h,

                index

            );

        }

    );



    /* ===================================== */
    /* POLEN MÁGICO */
    /* ===================================== */


    if (progress > 0.25) {


        const amount =
            Math.floor(
                20 +
                progress * 50
            );


        for (
            let i = 0;
            i < amount;
            i++
        ) {


            const x =

                (
                    Math.sin(
                        i * 17.13 +
                        time * 0.6
                    ) * 0.5 +
                    0.5
                ) * w;


            const y =

                (
                    Math.cos(
                        i * 9.21 +
                        time * 0.35
                    ) * 0.5 +
                    0.5
                ) * h;


            const size =
                1 +
                Math.sin(
                    time + i
                ) * 1;


            ctx.beginPath();


            ctx.arc(

                x,

                y,

                Math.max(
                    0.5,
                    size
                ),

                0,

                Math.PI * 2

            );


            ctx.fillStyle =
                `rgba(255,220,150,${0.18 * progress})`;


            ctx.fill();

        }

    }



    /* ===================================== */
    /* BRILLO FINAL */
    /* ===================================== */


    if (progress > 0.80) {


        const finalGlow =
            ctx.createRadialGradient(

                w * 0.5,

                h * 0.60,

                0,


                w * 0.5,

                h * 0.60,

                w * 0.70

            );


        finalGlow.addColorStop(

            0,

            `rgba(255,80,170,${
                (progress - 0.8) * 0.25
            })`

        );


        finalGlow.addColorStop(

            1,

            "rgba(255,80,170,0)"

        );


        ctx.fillStyle = finalGlow;


        ctx.fillRect(
            0,
            0,
            w,
            h
        );

    }

}



/* ========================================= */
/* REDIMENSIONAR CANVAS */
/* ========================================= */


function resizeCanvas() {


    const rect =
        canvas.parentElement
        .getBoundingClientRect();


    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        rect.width * dpr;


    canvas.height =
        rect.height * dpr;


    canvas.style.width =
        rect.width + "px";


    canvas.style.height =
        rect.height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    canvas.width = rect.width;
    canvas.height = rect.height;

}



/* ========================================= */
/* ANIMACIÓN PRINCIPAL */
/* ========================================= */


function animate(time) {


    const delta =
        lastFrameTime

            ? (time - lastFrameTime) / 1000

            : 0.016;


    lastFrameTime = time;



    if (
        !isComplete &&
        progress < 1
    ) {


        /* Velocidad del crecimiento */


        progress +=
            delta * 0.040;


        if (progress >= 1) {


            progress = 1;

            isComplete = true;


            setTimeout(
                showFinalMessage,
                1800
            );

        }


        document
            .getElementById("progressFill")
            .style.width =
                (progress * 100) + "%";


        document
            .getElementById("progressPercent")
            .textContent =
                Math.round(
                    progress * 100
                ) + "%";

    }


    drawScene(progress);


    requestAnimationFrame(animate);

}



/* ========================================= */
/* SISTEMA DE POEMAS */
/* ========================================= */


function showNextPoem() {


    if (
        poemIndex >= poems.length
    ) return;


    if (isComplete) return;


    const poem =
        poems[poemIndex];


    const poemText =
        document.getElementById(
            "poemText"
        );


    poemText.classList.remove("show");


    setTimeout(() => {


        poemText.innerHTML =
            poem.text;


        poemText.classList.add("show");


    }, 500);



    currentPoemTimeout =
        setTimeout(() => {


            poemText.classList.remove(
                "show"
            );


            poemIndex++;


            if (
                poemIndex < poems.length &&
                !isComplete
            ) {


                setTimeout(
                    showNextPoem,
                    900
                );

            }


        }, poem.delay);

}



/* ========================================= */
/* CARRUSEL */
/* ========================================= */


let currentSlide = 0;

let carouselInterval = null;

let carouselInitialized = false;


function initCarousel() {


    if (carouselInitialized) return;


    carouselInitialized = true;


    const track =
        document.getElementById(
            "carouselTrack"
        );


    const dots =
        document.getElementById(
            "dotsContainer"
        );


    track.innerHTML = "";

    dots.innerHTML = "";



    carouselImages.forEach(

        (image, index) => {


            const slide =
                document.createElement("div");


            slide.className =
                "carousel-slide";


            slide.innerHTML = `

                <img
                    src="${image.src}"
                    alt="Nuestro recuerdo ${index + 1}"
                >

                <div class="image-caption">

                    ${image.caption}

                </div>

            `;


            track.appendChild(slide);



            const dot =
                document.createElement("button");


            dot.className =
                "dot" +
                (
                    index === 0
                        ? " active"
                        : ""
                );


            dot.addEventListener(
                "click",
                () => {

                    goToSlide(index);

                }
            );


            dots.appendChild(dot);

        }

    );


    document
        .getElementById("prevBtn")
        .addEventListener(
            "click",
            () => {

                goToSlide(
                    currentSlide - 1
                );

            }
        );


    document
        .getElementById("nextBtn")
        .addEventListener(
            "click",
            () => {

                goToSlide(
                    currentSlide + 1
                );

            }
        );


    startAutoPlay();

}


function goToSlide(index) {


    const total =
        carouselImages.length;


    if (index < 0) {

        index = total - 1;

    }


    if (index >= total) {

        index = 0;

    }


    currentSlide = index;


    const track =
        document.getElementById(
            "carouselTrack"
        );


    track.style.transform =
        `translateX(-${index * 100}%)`;


    document
        .querySelectorAll(".dot")
        .forEach(
            (dot, i) => {

                dot.classList.toggle(
                    "active",
                    i === index
                );

            }
        );


    resetAutoPlay();

}


function startAutoPlay() {


    if (carouselInterval) {

        clearInterval(
            carouselInterval
        );

    }


    carouselInterval =
        setInterval(() => {


            goToSlide(
                currentSlide + 1
            );


        }, 4500);

}


function resetAutoPlay() {


    startAutoPlay();

}



/* ========================================= */
/* CORAZONES FLOTANTES */
/* ========================================= */


let heartsInterval = null;


function createFloatingHearts() {


    const container =
        document.getElementById(
            "floatingHearts"
        );


    const hearts = [

        "❤️",
        "💕",
        "💖",
        "💗",
        "🌸",
        "💝"

    ];


    if (heartsInterval) {

        clearInterval(
            heartsInterval
        );

    }


    heartsInterval =
        setInterval(() => {


            const heart =
                document.createElement("div");


            heart.className =
                "floating-heart";


            heart.textContent =
                hearts[
                    Math.floor(
                        Math.random() *
                        hearts.length
                    )
                ];


            heart.style.left =
                Math.random() *
                100 + "%";


            heart.style.fontSize =
                (
                    1 +
                    Math.random() * 1.8
                ) + "rem";


            heart.style.animationDuration =
                (
                    8 +
                    Math.random() * 7
                ) + "s";


            container.appendChild(heart);


            setTimeout(() => {

                heart.remove();

            }, 15000);


        }, 700);

}



/* ========================================= */
/* MOSTRAR MENSAJE FINAL */
/* ========================================= */


function showFinalMessage() {


    const section =
        document.getElementById(
            "messageSection"
        );


    section.classList.add(
        "visible"
    );


    initCarousel();

    createFloatingHearts();

}



/* ========================================= */
/* REINICIAR */
/* ========================================= */


function cleanScreen() {


    progress = 0;

    isComplete = false;

    poemIndex = 0;

    lastFrameTime = 0;



    document
        .getElementById("messageSection")
        .classList.remove(
            "visible"
        );


    document
        .getElementById("poemText")
        .classList.remove(
            "show"
        );


    document
        .getElementById("progressFill")
        .style.width = "0%";


    document
        .getElementById("progressPercent")
        .textContent = "0%";


    if (currentPoemTimeout) {

        clearTimeout(
            currentPoemTimeout
        );

    }


    if (carouselInterval) {

        clearInterval(
            carouselInterval
        );

        carouselInterval = null;

    }


    if (heartsInterval) {

        clearInterval(
            heartsInterval
        );

        heartsInterval = null;

    }


    document
        .getElementById("floatingHearts")
        .innerHTML = "";


    currentSlide = 0;


    setTimeout(
        showNextPoem,
        1000
    );

}



/* ========================================= */
/* INICIAR */
/* ========================================= */


function init() {


    resizeCanvas();


    window.addEventListener(
        "resize",
        resizeCanvas
    );


    document
        .getElementById("cleanBtn")
        .addEventListener(
            "click",
            cleanScreen
        );


    if (!animationStarted) {

        animationStarted = true;

        requestAnimationFrame(
            animate
        );

    }


    setTimeout(
        showNextPoem,
        1200
    );

}


window.addEventListener(
    "load",
    init
);


</script>
