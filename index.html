<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌸 Nuestro jardín de lirios 🌸</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Georgia,"Times New Roman",serif;
    background:#071018;
}


/* =========================================
   CONTENEDOR PRINCIPAL
========================================= */

.container{
    position:fixed;
    inset:0;
    width:100%;
    height:100vh;
    overflow:hidden;
}


/* =========================================
   CANVAS
========================================= */

canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    cursor:crosshair;
}


/* =========================================
   INSTRUCCIÓN
========================================= */

.name{
    position:fixed;
    top:50%;
    left:50%;

    width:90%;

    transform:translate(-50%,-50%);

    color:white;

    text-align:center;

    font-size:clamp(22px,4vw,48px);

    text-shadow:
        0 0 10px #ff6bb5,
        0 0 30px rgba(255,70,160,.6);

    user-select:none;
    pointer-events:none;

    z-index:10;

    animation:pulseText 2s infinite;
}


.name small{

    display:block;

    margin-top:15px;

    font-size:clamp(14px,2vw,20px);

    color:#ffd4e8;

    font-family:Arial,sans-serif;

    font-weight:normal;

}


@keyframes pulseText{

    0%,100%{
        opacity:.75;
        transform:translate(-50%,-50%) scale(1);
    }

    50%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1.04);
    }

}


/* =========================================
   BOTÓN LIMPIAR
========================================= */

.clean-btn{

    position:fixed;

    left:25px;
    bottom:20px;

    z-index:20;

    font-family:Arial,sans-serif;

    font-size:14px;

    color:white;

    background:rgba(0,0,0,.25);

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,.15);

    border-radius:30px;

    padding:10px 18px;

    cursor:pointer;

    opacity:.75;

    transition:.3s;

}


.clean-btn:hover{

    opacity:1;

    transform:scale(1.05);

    background:rgba(255,70,150,.25);

}


/* =========================================
   POEMAS
========================================= */

.poem-box{

    position:fixed;

    top:8%;

    left:50%;

    transform:translateX(-50%);

    width:min(85%,800px);

    text-align:center;

    z-index:15;

    pointer-events:none;

}


.poem{

    color:#fff4fa;

    font-size:clamp(20px,2.5vw,34px);

    line-height:1.5;

    text-shadow:

        0 0 10px rgba(255,100,180,.7),

        0 0 30px rgba(255,80,150,.35);

    opacity:0;

    transform:translateY(20px);

    transition:1.5s ease;

}


.poem.show{

    opacity:1;

    transform:translateY(0);

}


.progress-container{

    width:300px;

    max-width:70%;

    height:5px;

    background:rgba(255,255,255,.15);

    margin:20px auto;

    border-radius:20px;

    overflow:hidden;

}


.progress{

    height:100%;

    width:0%;

    background:linear-gradient(
        90deg,
        #ff6cab,
        #ffd1e5
    );

    box-shadow:0 0 15px #ff4f9c;

    transition:width .3s;

}


/* =========================================
   PANTALLA FINAL
========================================= */

.final-screen{

    position:fixed;

    inset:0;

    background:rgba(5,8,15,.96);

    backdrop-filter:blur(15px);

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:100;

    opacity:0;

    pointer-events:none;

    transition:2s ease;

}


.final-screen.show{

    opacity:1;

    pointer-events:auto;

}


.final-content{

    width:min(90%,700px);

    text-align:center;

}


.final-content h1{

    font-size:clamp(38px,7vw,70px);

    color:#ff70b0;

    text-shadow:

        0 0 20px #ff3f91,

        0 0 60px rgba(255,40,150,.6);

}


.final-content h2{

    margin:15px 0 30px;

    color:#fff0f6;

    font-weight:normal;

}


/* =========================================
   CARRUSEL
========================================= */

.carousel{

    position:relative;

    width:100%;

    overflow:hidden;

    border-radius:25px;

    background:#111;

}


.track{

    display:flex;

    transition:transform .7s ease;

}


.slide{

    min-width:100%;

}


.slide img{

    width:100%;

    height:min(55vh,430px);

    object-fit:cover;

    display:block;

}


.caption{

    padding:15px;

    color:#ffe5f1;

}


.carousel button{

    position:absolute;

    top:50%;

    transform:translateY(-50%);

    width:50px;
    height:50px;

    border-radius:50%;

    border:none;

    background:rgba(0,0,0,.45);

    color:white;

    font-size:35px;

    cursor:pointer;

}


.prev{
    left:10px;
}

.next{
    right:10px;
}


.dots{

    margin-top:18px;

    display:flex;

    justify-content:center;

    gap:10px;

}


.dot{

    width:10px;
    height:10px;

    border-radius:50%;

    background:#555;

    cursor:pointer;

}


.dot.active{

    background:#ff5ca8;

    box-shadow:0 0 15px #ff5ca8;

}

</style>

</head>

<body>

<div class="container">

```
<canvas id="canvas"></canvas>

<div class="name" id="instruction">

    🌸 Toca la pantalla para hacer crecer un lirio 🌸

    <small>
        Cada toque hará florecer una nueva flor en nuestro jardín
    </small>

</div>


<div class="poem-box">

    <div class="poem" id="poem"></div>

    <div class="progress-container">

        <div class="progress" id="progress"></div>

    </div>

</div>


<button class="clean-btn" id="cleanBtn">

    ✨ Volver a empezar

</button>
```

</div>

<!-- =====================================
     PANTALLA FINAL
===================================== -->

<div class="final-screen" id="finalScreen">

```
<div class="final-content">

    <h1>
        🌸 Te amo Ale 🌸
    </h1>

    <h2>
        Nuestro jardín apenas comienza a florecer ❤️
    </h2>


    <div class="carousel">

        <button class="prev" id="prevBtn">
            ‹
        </button>

        <div class="track" id="track"></div>

        <button class="next" id="nextBtn">
            ›
        </button>

    </div>


    <div class="dots" id="dots"></div>

</div>
```

</div>

<script>


/* =========================================
   CANVAS
========================================= */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


function resizeCanvas(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}


resizeCanvas();

window.addEventListener(
    "resize",
    resizeCanvas
);



/* =========================================
   VARIABLES
========================================= */

let flowers = [];

let particles = [];

let startTime =
    Date.now();

let experienceStarted =
    false;

let experienceFinished =
    false;



/* =========================================
   CONFIGURACIÓN
========================================= */

const EXPERIENCE_TIME =
    55000;


/* =========================================
   POEMAS
========================================= */

const poems = [

    "🌱 Todo comenzó como una pequeña semilla...",

    "🌿 Y poco a poco, contigo, algo hermoso comenzó a crecer.",

    "🌸 Cada momento a tu lado hizo florecer mi corazón.",

    "💖 Porque en el jardín de mi vida, tú eres mi flor favorita.",

    "❤️ Seis meses contigo... y deseo que sean muchos más.",

    "🌸 Te amo Ale, y quiero seguir construyendo nuestro jardín juntos. 🌸"

];


let currentPoem =
    0;


const poemEl =
    document.getElementById("poem");


function showPoem(index){

    poemEl.classList.remove("show");


    setTimeout(() => {

        poemEl.textContent =
            poems[index];

        poemEl.classList.add("show");

    },500);

}



/* =========================================
   CREAR FLOR
========================================= */

function createFlower(x,y){

    if(experienceFinished)
        return;


    experienceStarted = true;


    const maxHeight =
        70 +
        Math.random()*90;


    flowers.push({

        x:x,

        y:y,

        height:maxHeight,

        progress:0,

        speed:
            0.0015 +
            Math.random()*0.001,

        color:
            Math.random()>.5
            ? "#ff8fbd"
            : "#ffd1e2",

        accent:
            "#b51c62",

        wind:
            Math.random()*10,

        created:
            Date.now()

    });


    createParticles(x,y,25);


}



/* =========================================
   PARTÍCULAS
========================================= */

function createParticles(x,y,amount){

    for(let i=0;i<amount;i++){

        particles.push({

            x:x,

            y:y,

            vx:
                (Math.random()-.5)*3,

            vy:
                (Math.random()-.5)*3-1,

            size:
                Math.random()*4+1,

            life:
                1,

            decay:
                .01+
                Math.random()*.02

        });

    }

}



/* =========================================
   TALLO
========================================= */

function drawStem(flower){

    const height =
        flower.height *
        Math.min(
            flower.progress*2.5,
            1
        );


    const wind =
        Math.sin(
            Date.now()/1000+
            flower.wind
        )*5;


    ctx.beginPath();

    ctx.moveTo(
        flower.x,
        flower.y
    );


    ctx.quadraticCurveTo(

        flower.x+wind,

        flower.y-height*.5,

        flower.x+wind*.5,

        flower.y-height

    );


    ctx.strokeStyle =
        "#3f8c4d";

    ctx.lineWidth =
        5;

    ctx.lineCap =
        "round";

    ctx.stroke();



    /* HOJAS */


    if(flower.progress>.2){

        const leafY =
            flower.y-height*.45;


        ctx.fillStyle =
            "#4e9c54";


        drawLeaf(

            flower.x,

            leafY,

            -1,

            35

        );


        drawLeaf(

            flower.x,

            leafY+15,

            1,

            32

        );

    }

}



/* =========================================
   HOJA
========================================= */

function drawLeaf(
    x,
    y,
    direction,
    size
){

    ctx.beginPath();


    ctx.moveTo(x,y);


    ctx.quadraticCurveTo(

        x+
        direction*size,

        y-size*.4,

        x+
        direction*size*1.6,

        y

    );


    ctx.quadraticCurveTo(

        x+
        direction*size,

        y+size*.25,

        x,

        y

    );


    ctx.fill();

}



/* =========================================
   LIRIO
========================================= */

function drawLily(flower){

    if(flower.progress<.4)
        return;


    const bloom =
        Math.min(
            (flower.progress-.4)*2,
            1
        );


    const topY =
        flower.y-
        flower.height;


    const size =
        28+
        bloom*25;


    ctx.save();


    ctx.translate(

        flower.x,

        topY

    );


    ctx.globalAlpha =
        bloom;


    /* 6 PÉTALOS */


    for(let i=0;i<6;i++){

        ctx.save();


        ctx.rotate(
            i*Math.PI/3
        );


        const gradient =
            ctx.createLinearGradient(

                0,

                0,

                0,

                -size

            );


        gradient.addColorStop(
            0,
            flower.accent
        );

        gradient.addColorStop(
            .5,
            flower.color
        );

        gradient.addColorStop(
            1,
            "#fff8fb"
        );


        ctx.fillStyle =
            gradient;


        ctx.beginPath();


        ctx.moveTo(0,0);


        ctx.bezierCurveTo(

            size*.5,
            -size*.3,

            size*.45,
            -size*.9,

            0,
            -size*1.2

        );


        ctx.bezierCurveTo(

            -size*.45,
            -size*.9,

            -size*.5,
            -size*.3,

            0,
            0

        );


        ctx.fill();


        ctx.restore();

    }



    /* CENTRO */


    ctx.beginPath();


    ctx.arc(

        0,

        0,

        size*.16,

        0,

        Math.PI*2

    );


    ctx.fillStyle =
        "#ffd36b";


    ctx.fill();



    /* ESTAMBRES */


    for(let i=0;i<6;i++){

        const angle =
            i*Math.PI/3;


        const length =
            size*.55;


        ctx.beginPath();


        ctx.moveTo(0,0);


        ctx.lineTo(

            Math.cos(angle)*length,

            Math.sin(angle)*length

        );


        ctx.strokeStyle =
            "#9a6723";

        ctx.lineWidth=2;

        ctx.stroke();


        ctx.beginPath();


        ctx.arc(

            Math.cos(angle)*length,

            Math.sin(angle)*length,

            3,

            0,

            Math.PI*2

        );


        ctx.fillStyle =
            "#d69a31";

        ctx.fill();

    }


    ctx.restore();

}



/* =========================================
   DIBUJAR PARTÍCULAS
========================================= */

function updateParticles(){

    particles.forEach((p,index)=>{

        p.x+=p.vx;

        p.y+=p.vy;

        p.vy+=.02;

        p.life-=p.decay;


        ctx.beginPath();


        ctx.arc(

            p.x,

            p.y,

            p.size,

            0,

            Math.PI*2

        );


        ctx.fillStyle =
            `rgba(255,190,220,${p.life})`;


        ctx.fill();


        if(p.life<=0){

            particles.splice(
                index,
                1
            );

        }

    });

}



/* =========================================
   FONDO
========================================= */

function drawBackground(){

    const gradient =
        ctx.createLinearGradient(

            0,
            0,
            0,
            canvas.height

        );


    gradient.addColorStop(
        0,
        "#07131f"
    );

    gradient.addColorStop(
        .6,
        "#172b32"
    );

    gradient.addColorStop(
        1,
        "#102416"
    );


    ctx.fillStyle=
        gradient;


    ctx.fillRect(

        0,
        0,
        canvas.width,
        canvas.height

    );



    /* ESTRELLAS */


    for(let i=0;i<50;i++){

        const x=
            (i*137)%canvas.width;

        const y=
            (i*73)%
            (canvas.height*.6);


        ctx.beginPath();


        ctx.arc(

            x,
            y,
            1,
            0,
            Math.PI*2

        );


        ctx.fillStyle=
            "rgba(255,255,255,.35)";


        ctx.fill();

    }

}



/* =========================================
   PROGRESO Y TIEMPO
========================================= */

function updateExperience(){

    const elapsed =
        Date.now()-startTime;


    const percentage =
        Math.min(

            elapsed/
            EXPERIENCE_TIME,

            1

        );


    document
        .getElementById("progress")
        .style.width=
            percentage*100+"%";


    const poemIndex=
        Math.min(

            Math.floor(
                percentage*
                poems.length
            ),

            poems.length-1

        );


    if(poemIndex!==currentPoem){

        currentPoem=
            poemIndex;

        showPoem(
            currentPoem
        );

    }


    if(

        percentage>=1 &&

        !experienceFinished

    ){

        experienceFinished=true;


        setTimeout(
            showFinalScreen,
            1500
        );

    }

}



/* =========================================
   ANIMACIÓN
========================================= */

function animate(){

    drawBackground();


    flowers.forEach(flower=>{

        flower.progress+=
            flower.speed;


        flower.progress=
            Math.min(
                flower.progress,
                1
            );


        drawStem(flower);

        drawLily(flower);

    });


    updateParticles();


    if(!experienceFinished){

        updateExperience();

    }


    requestAnimationFrame(
        animate
    );

}


animate();



/* =========================================
   EVENTOS MOUSE
========================================= */

canvas.addEventListener(
    "click",
    e=>{

        createFlower(

            e.clientX,

            e.clientY

        );

    }

);



/* =========================================
   EVENTOS TOUCH
========================================= */

canvas.addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();


        const touch=
            e.touches[0];


        createFlower(

            touch.clientX,

            touch.clientY

        );

    },

    {passive:false}

);



/* =========================================
   INICIAR POEMAS
========================================= */

showPoem(0);



/* =========================================
   LIMPIAR / REINICIAR
========================================= */

document
.getElementById("cleanBtn")
.addEventListener(
    "click",
    ()=>{


        flowers=[];

        particles=[];

        startTime=
            Date.now();

        currentPoem=0;

        experienceFinished=false;

        experienceStarted=false;


        document
        .getElementById("finalScreen")
        .classList.remove("show");


        showPoem(0);


    }
);



/* =========================================
   CARRUSEL
========================================= */


const images=[

    {
        src:"images/foto1.jpg",
        text:"❤️ Nuestro primer recuerdo"
    },

    {
        src:"images/foto2.jpg",
        text:"🌸 Momentos que nunca olvidaré"
    },

    {
        src:"images/foto3.jpg",
        text:"💖 Tú haces mi vida más bonita"
    },

    {
        src:"images/foto4.jpg",
        text:"✨ Por muchos recuerdos más"
    }

];


let slideIndex=0;


const track=
    document.getElementById("track");


const dots=
    document.getElementById("dots");


images.forEach((image,index)=>{


    const slide=
        document.createElement("div");


    slide.className="slide";


    slide.innerHTML=`

        <img src="${image.src}">

        <div class="caption">

            ${image.text}

        </div>

    `;


    track.appendChild(slide);



    const dot=
        document.createElement("div");


    dot.className=
        index===0
        ? "dot active"
        : "dot";


    dot.onclick=()=>{

        goToSlide(index);

    };


    dots.appendChild(dot);

});


function goToSlide(index){


    if(index<0)
        index=images.length-1;


    if(index>=images.length)
        index=0;


    slideIndex=index;


    track.style.transform=
        `translateX(-${index*100}%)`;


    document
    .querySelectorAll(".dot")
    .forEach((dot,i)=>{


        dot.classList.toggle(

            "active",

            i===index

        );

    });

}



document
.getElementById("prevBtn")
.addEventListener(
    "click",
    ()=>{

        goToSlide(
            slideIndex-1
        );

    }
);



document
.getElementById("nextBtn")
.addEventListener(
    "click",
    ()=>{

        goToSlide(
            slideIndex+1
        );

    }
);



/* =========================================
   PANTALLA FINAL
========================================= */

function showFinalScreen(){


    document
    .getElementById("instruction")
    .style.display=
        "none";


    document
    .getElementById("finalScreen")
    .classList.add(
        "show"
    );

}


</script>

</body>
</html>
